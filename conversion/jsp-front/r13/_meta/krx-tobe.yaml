description: '⚠**역할 정정 2026-08-08**: KRX 정본 치환 매핑표(`catalog/function-map/krx-substitution.yaml`, 식별자 152종)가 반입되면서 이 표의 역할이 좁아졌다.
  본 표 = **관례·패턴 축**(식별자로 표현되지 않는 것 — "jQuery show/hide"·"메시지 문자열 하드코딩"·"$.ajax / form submit 조회").
  정본 = **식별자 축**(fn_Trim → $c.str.trim). 실측 대조(2026-08-08): 우리 16행 중 정본과 겹치는 것은 2행뿐이고 14행은 패턴이라 정본이 담을 수 없다 — 둘은 경쟁이 아니라 상보다.
  ⛔식별자 1:1 치환은 이 표에 추가하지 않는다(정본에 있다). 여기에는 패턴만 남긴다.
  구 description: as-is(krx-jsp) 함수·관례 → to-be 재작성 대응표 — 원천 = 변환샘플 6쌍 작업본(tobe_작업소스) 쌍 대조 실측(2026-08-05). 아는 것만 행으로, 모르는 것은 생성 리포트 warn → 사용자 승인 순환으로 추가(임의 추정 금지).'
source: 'krx-tobe-commons/KRX_웹스퀘어_전환/변환샘플파일/ (jsp_asis소스 ↔ tobe_작업소스 6쌍)'
# ── 인자 계약 축 (2026-09-27 @editor 판정) ───────────────────────────────────
#   `component_contract` = 「이 함수는 **인자를 웹스퀘어 컴포넌트로 받는다**」는 계약 선언.
#   왜 표인가: 이 사실을 읽어야 하는 자리가 둘인데(스크립트의 인자 자리 · 마크업의 인라인 `this`)
#     **마크업이 스크립트보다 먼저 돌아**(실측: to-websquare-v2 → renderHead) 런타임 목록으로는
#     넘길 수 없다. 표는 디스크에 있으니 순서가 무관하고, 두 자리가 같은 진실원을 읽는다.
#   ⛔등재 조건: 그 이름의 **몸통이 «그 이름을 가진 전 화면»에서** 컴포넌트 계약으로 옮겨졌을 때만.
#     한 화면이라도 요소 계약으로 남으면 등재하지 않는다 — 등재하면 그 화면에서 호출 자리는 컴포넌트를
#     넘기고 몸통은 `.value` 를 기대해 **조용히 죽는다**(handleError 가 삼킨다).
#     실측 근거(2026-09-27): `numFormat` 은 스펙 6화면에 **5가지 다른 몸통**이다(865~1,600자).
#   ⛔여기 없는 이름은 종전(DOM 요소 `$c.util.fieldEl`) + 진단 `unresolved:dom-contract:<fn>`.
#   읽는 곳: apps/editor-web/lib/generate/websquare/render-head.ts `componentContractOf`
#            → render-script → port-form-access `argRef` · (전환축) to-websquare-v2 인라인 `this` 자리.
#   ⏳등재 후보 **27 함수 · 호출 846** (정적 분류 실측 2026-09-27) — 몸통을 가진 전 화면에서 매개변수
#     사용이 `value`·`src`·`focus` 뿐이라 생성기가 컴포넌트 계약으로 전부 옮긴다(get/setValue·get/setSrc).
#     swapImage(608) · emailCheck(80) · hideTitle(41) · Chk_Date(38) · chg_group(25) · openInfo(14) · checkCredit(8) · changeFixAmt(4) · checkETF(3) · checkIsuCd(3) · Chk_Sosu_Point_Final_Pay_Amt(2) · fn_swapImage(2) · displayInformation(2) · search(2) · CheckDate(2) · fnCheckCurrentTime(1) · fnCorpType(1) · selectChange(1) · setMailDiv(1) · open_select_inst_cd(1) · setURL(1) · itemSelect(1) · imgChange(1) · periodChange(1) · setFormVer(1) · findTypeTpClsses(1) · changeEditMode(1)
#   ⛔그런데 **아직 올리지 않는다** — 이 이름들의 호출 자리에는 as-is 인라인 핸들러의 `this`(산출 `selfVar`)가
#     있고(기준 목록 tools/krx-tobe-cycle/_this-arg-contract-census.tsv 가 그 축이다), 그 자리를 컴포넌트로
#     바꾸는 쪽(전환축 to-websquare-v2 인라인 핸들러 방출)이 착지 전이다. 표에 올리면 몸통만 컴포넌트가 되고
#     호출은 요소를 넘겨 **조용히 죽는다**(실측: top 화면 `scwin.fn_swapImage(selfVar)`).
#     ⇒ 두 축이 같은 표를 읽으니 그쪽이 착지하면 이 후보 목록을 그대로 올린다.
#   나머지 50 함수(호출 616)는 못 옮기는 사용이 있어 종전(요소)+진단이다 — goLeftMenu 143 `_menu.menu_id`
