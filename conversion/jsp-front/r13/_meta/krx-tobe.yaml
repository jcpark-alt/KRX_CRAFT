# ── 모듈 개명 이관 준비 (#116 — 2026-08-30 실측 박제, ⛔발동 대기) ───────────────
#   작업본(20260821)은 $c.stf(1,052건)·$c.lce(35건)가 표준 — fil→stf·lc→lce 개명 확정.
#   그러나 **현행 배포 셸(8775) 런타임 실측: stf/lce 미노출**(fil 91·lc 79 만 존재) —
#   지금 이관하면 배선 전멸. 셸이 작업본 최신판으로 갱신되는 시점에 **원자 전환**한다
#   (§118 인자 시프트 실사고와 같은 원칙 — 반쪽 전환 금지):
