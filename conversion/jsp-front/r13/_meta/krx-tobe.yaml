# ── as-is 화면 전용 함수 인라인 자원 루트 (2026-08-28 신설, backlog #118 잔여) ────────────
#   `G4-external-modules.yaml` 의 `as_is_externals.named_files` 가 가리키는 파일들의 실제 위치.
#   추출이 화면별 `<script src>` 목록을 이미 담아 두었으므로(전판 2,105 스펙 전건 보유), 생성기는
#   **스펙이 가리킨 파일만** 읽어 그 화면에 인라인한다 — as-is JSP 를 해석하지 않으므로 source-blind 유지.
#
#   왜 공통자원으로 못 싣는가: 같은 이름인데 **파일마다 구현이 다르다**(`fn_RmComma`·`fn_DelComma`·
#   `fn_insertComma`·`fn_removeComma`·`fn_checkNumFormat`·`fn_CommaValueAll`·`fn_RmCommaValueAll`·
#   `fn_RmCommaValueAllForKO`·`fn_issSchdCheckValues` — 72화면). 하나만 실으면 어느 화면은 틀린 구현을
#   받는다. 다수는 `form["fbzNetcap"]` 처럼 특정 폼 필드를 하드코딩한 **그 화면 전용 코드**다.
#   실측 확정: 이 목록으로 72화면을 대조하니 **전부 유일 확정**됐다
#   (`jldfil71803c → digitalNumberFormat.js` · `jldfil71005c → lossLimitEtnNumberFormat.js`).
#
#   ⚠공통자원 모듈(`modules.builtin.krx-tobe-asis-js`, 91종)이 이미 공급하는 이름은 **주입하지 않는다**.  # ── #120 본문 판정분 (2026-08-30 — 형제 화면 동일 정의를 표준으로 대치, 반입 아님) ──
