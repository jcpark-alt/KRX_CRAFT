# ── as-is 실물 부재분의 gcc 대치 (2026-08-29 신설) ────────────────────────────
#   축: as-is 정의가 **어디에도 없어** 그대로 두면 화면이 죽는데, **사용 형태 + 작업본 어휘 + gcc
#   실물 시그니처** 셋이 맞아 대응을 확정할 수 있는 것. 셸 실물 이식(common_fn_map)과 다르다.
#
#   ⛔등재 조건(셋 다 충족해야 한다 — 이름 유사로는 등재하지 않는다):
#     ① as-is **사용 형태**를 전수로 확인했다(인자 수·반환값 사용 여부·붙는 이벤트)
#     ② **작업본이 그 gcc 함수를 실제로 쓴다**(사용 건수 기재)
#     ③ **gcc 실물 시그니처**가 as-is 호출과 맞는다(사전 아닌 실물 대조 — §125·#119 교훈)
#
#   미충족은 등재하지 않고 요청 목록에 남긴다. 예: `Chk_Date2(this,'라벨')` 는 유효성 + **경고
#   문구**가 한 몸이라 gcc 단일 함수로 안 맞는다(작업본은 제출 시 `$c.validate.validateDataCollect`
#   19건으로 폼 단위 검증을 하는데 이는 구조 변경이라 별도 결정) · `fnLegendTooltip()` 은 차트 축
#   정보가 없다 · `fn_emailCheck()` 는 인자가 없어 허용 문자를 알 수 없다.
derived_fn_map:
  - asis: fCheckDate
    tobe: $c.date.isDate
    screens: 45
    evidence_usage: "`if(!fCheckDate(<날짜값>))` — 1인자·반환 boolean(전수 194건 중 1인자 형이 전부)"
    evidence_working_sample: "$c.date.isDate 14건 (20260821_KRX_Conversion)"
    evidence_impl: "scwin.isDate(sDate, timeChk) — timeChk 는 `typeof timeChk == \"boolean\"` 일 때만 발동(옵션). 1인자 호출 무해(실물 확인)"
  - asis: fn_SetComma
    tobe: $c.num.formatNumber
    screens: 35
    evidence_usage: '1인자 순수 콤마 포맷(재귀 정규식) — 반환 사용'
    evidence_working_sample: 'dataType number displayFormat "#,###" 456건 계열 + formatNumber 정본 치환표 동계열(fn_NumberFormat)'
    evidence_impl: 'scwin.formatNumber(value) — WebSquare.util.setNumber 위임(실물 확인)'
  - asis: fn_replaceDsp
    tobe: $c.date.dateUnFormat
    screens: 24
    evidence_usage: '1인자 — 날짜 표시문자열의 구분자 제거(replace /[/,-]/g)'
    evidence_working_sample: 'dateUnFormat 은 치환표 기등재(chkDate→dateFormat 계열)'
    evidence_impl: 'scwin.dateUnFormat(dateStr) = 비숫자 전제거 — 날짜 문자열에서 [/,-] 제거의 상위집합(등가, 실물 확인)'
  - asis: closeWin
    tobe: $c.win.closePopup
    screens: 9
    evidence_usage: '0인자 — this.close() (자기 창 닫기)'
    evidence_working_sample: 'closePopup 작업본 3건 + 팝업 반환 표준(2026-08-14 E2E 실증)'
    evidence_impl: 'scwin.closePopup(param) — param 옵션(무인자 닫기 관례 기사용, 실물 확인)'

