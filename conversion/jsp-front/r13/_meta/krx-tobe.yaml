# ═══ 그쪽 몫 — `$c.cm.fn_*` 부록 ②: §7.2 목록 밖 19종 (치환 방향 미정) ════════
#   왜 처방이 없는가: 박지철 문서 §7.2 는 **그쪽 33화면**이 부른 9종만 다룬다. 우리 산출 2,217본은
#   `$c.cm.fn_*` 를 **28종** 부르고, 9종 밖 19종 948건에는 **치환 방향이 아직 없다**.
