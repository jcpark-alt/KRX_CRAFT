  - id: local-fn-preserved
    rule: '화면 로컬 업무 함수(fn_*)는 scwin.fn_* 로 이름 보존 재작성 — 유틸·관례 호출만 $c 치환'
    evidence: '35700 fn_checkValueMkt·changeType·changeStockType 동명 확인'
  - id: event-handler-naming
    rule: '이벤트 바인딩(jQuery click·addEventListener·인라인) → `<컴포넌트id>_on<이벤트>` 핸들러 (btn_write_onclick·grd_Grid_oncellclick·cal_divBasDd_onblur)'
    evidence: '전 샘플 — G1 이벤트 emit 관례'
  - id: submission-callback-naming
    rule: 'submission 콜백 = `sbm_<id>_submitdone` / 커스텀 = submitDoneHandler·submitErrorHandler 옵션'
    evidence: '52100 sbm_selectOne/create/modify_submitdone'
  - id: init-naming
    rule: '초기화 = scwin.onpageload → fn_init/fn_search 호출 사슬'
    evidence: '전 샘플'

