    note: '⚠⑴**호출 시점이 바뀐다** — as-is 는 onblur 마다 부르는 «판정 함수»이고 to-be 는 onpageload 에 **바인딩을 심는 등록기**다. 산출 실물 111건 중 94건이 `$c.cm.fn_CheckDate(selfVar)`(이벤트 위치)라 **호출 자리를 지우고 등록 자리를 만드는** 이관이다. ⑵반환값을 가드로 쓰는 자리(`if(!fn_CheckDate(x)) return;`)는 등록으로 대체되지 않는다 — 그 자리는 `checkCalendarFormat` 을 **직접 호출**해 boolean 을 받는다(같은 함수가 현재 값 기준 판정도 돌려준다). ⑶대상이 inputCalendar 가 아닌 순수 input 이면 성립하지 않는다(date.xml:1139 — getValue 없으면 console.error 후 false). 화면별 컴포넌트 종류 확인이 선행. ⑷실패 시 동작이 다르다: as-is 는 값을 **남기고** 안내, 표준은 기본 `clearOnInvalid:true` 로 **빈값 초기화** — 종전 동작을 지키려면 `{ clearOnInvalid: false }`.'
    decision: '@editor 판정 2026-09-27: 종전 동작 유지 — 가드 자리(if(!fn_CheckDate(x)))는 boolean 직접 호출 + { clearOnInvalid: false }.'
    superseded_by: 'common_fn_map: fn_CheckDate → $c.cm.fn_CheckDate'

