    adapter_by_argc:
      '2': "(($c.util.getComponent($2) && $c.util.getComponent($2).setValue) ? $c.util.getComponent($2).setValue($c.num.formatNumberKor(String(((($1) && ($1).getValue) ? ($1).getValue() : (((($1) && typeof ($1).val === 'function') ? ($1).val() : ((($1) && ($1).value !== undefined) ? ($1).value : ($1))))) == null ? '' : ((($1) && ($1).getValue) ? ($1).getValue() : (((($1) && typeof ($1).val === 'function') ? ($1).val() : ((($1) && ($1).value !== undefined) ? ($1).value : ($1)))))).replace(/,/g, ''))) : console.warn('[sdd] num2won 대상 미해결: ' + $2))"
