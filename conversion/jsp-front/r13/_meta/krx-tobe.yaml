# ── 정본 치환표 인자 정합 감사 (2026-08-28 신설) ──────────────────────────────
#   축: `krx-substitution.yaml`(KRX 정본)의 자동 치환이 **이름만 바꾸고 인자를 안 본다**는 실측.
#
#   ⛔정본 파일은 손대지 않는다(재생성 = tools/krx-submap/build.mjs). 감사 결과는 여기 남긴다.
#
#   측정법: **gcc 실물 시그니처**(`krx-tobe-commons/gcc-patched/cm/gcc/*.xml` 의 `scwin.X = function(...)`)
#     ↔ as-is 호출부 인자 수(`krx-jsp/source` 전수, 최상위 콤마 파싱). ⚠gcc **사전**(catalog/gcc)의
#     `params` 로는 판정할 수 없다 — 옵션/필수 표기가 없어 `getByteLength(str, ignoreChar)` 의
#     둘째 인자를 필수로 오판했다. **실물이 진실원**이다.
#
#   결과: 정본 141행 중 as-is 호출 실측 가능 **68행** · 인자 수 불일치 **34행 / 9,040건 호출**.
#
#   ⚠**자동 판정만으로 옵션/필수를 가를 수 없다** — 둘 다 실측으로 확인했다:
#     · `$c.str.getByteLength(str, ignoreChar)` 는 본문이 `WebSquare.util.getStringByteSize(str, ignoreChar)`
#       **pass-through** 라 인자 1개 호출이 **무해**하다(가드가 없어 "필수"로 잡히지만 아니다).
#     · `$c.str.isEmail(str)` 는 `typeof str != "undefined"` 가드가 **있는데도** 인자 0개면
#       **항상 false** 를 준다(가드가 있다고 무해가 아니다).
#     그래서 `verdict:` 는 **행마다 실물을 읽어** 채운다. 미확인은 `unknown` 으로 두고 지어내지 않는다.
#
#   `adapter:` = 기능 등가로 만드는 인자 어댑터(사용자 방침 2026-08-28 "그에 맞추어 변경하면 되지 않나").
#     예) `fn_IgnoreSpaces(s)` → `$c.str.replaceAll(s, " ", "")`. 채워진 행만 소비층이 쓴다.
#     빈 행은 **자동 치환 대상에서 빼고 저작 몫으로 진단**하는 것이 안전하다(backlog #119).


# ── KRX 제공 공통 **상수** 배선 (2026-08-28 신설) ─────────────────────────────
#   축: as-is 화면이 정의 없이 **참조**하던 상수 → 셸이 노출하는 `$c.<모듈>.<원래이름>`.
#   ⚠1·2차 대조가 **함수만** 봤다(호출 `X(` 패턴). 상수는 호출이 아니라 **참조**라 통째로 놓쳤다.
#   실측: 셸 노출 상수 중 미배선 **13종 / 54건 / 23화면**(상수형 대문자 식별자 한정 —
#   `path`·`parent`·`focus` 같은 흔한 이름은 오탐이라 제외).
#   ⛔치환은 **참조 자리**다 — 호출부 치환(portGccCalls)이 아니라 식별자 참조를 바꾼다.
# ── as-is commons 파일 **상수 선언** (2026-09-28 사용자 결정) ────────────────
#   축: 셸 gcc 가 노출하지 **않고** as-is 공용 `.js` 파일에만 정의가 있던 상수.
#   as-is 화면은 `<script src="/js/elw.js">` 로 그 파일을 실었으나 **셸은 싣지 않는다**
#   (실측: as-is `<script src>` 139종/744화면 중 셸 교집합 0). 그래서 산출에서 bare 참조가
#   `ReferenceError` 를 내 **onpageload 가 통째로 죽는다**(worker 런타임 실측 19화면).
#   ⛔`common_const_map`(위)과 **다른 축**이다 — 저쪽은 `$c.<모듈>.<이름>` 으로 배선하지만
#     이쪽은 배선할 gcc 실물이 **없다**.
#   처방(사용자 2026-09-28): 「일단 권장안(화면 안 scwin 상수 선언, 값 = elw.js 실물,
#     이름 보존)으로 하고 **질의서 및 소스 전달 시 반드시 알려 합의**」.
#   ⇒ 그 화면이 **실제로 참조하는 것만** `scwin.<이름> = <값>;` 로 선언한다(전 화면 일괄 아님).
#   ⛔값을 짓지 않는다 — `source` 파일 실물에서 읽은 것만 적는다.
#   ⚠`mutable: true` 는 상수가 아니라 **가변 상태**다(`openCalendarObj.value = …` 로 쓰인다).
#     값 인라인하면 `null.value` 로 죽으므로 **선언만** 세운다.
