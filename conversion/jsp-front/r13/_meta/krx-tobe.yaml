  #   ⚠명세(`catalog/gcc/krx.yaml`)의 `returns` 로는 판정할 수 없다 — 비동기 23종 중 **21종이 미선언**이고
  #   `$c.win.alert` 은 returns 가 "Context가 포함된 파일경로"로 **오기**돼 있다(@editor 통보분).
  #
  #   `auto:` 재판정 — 2026-08-06 전면 철회를 **부분 복원**한다.
  #   철회 사유였던 무한 팝업(35700 alert 305개)의 진짜 조건은 "비동기"가 아니라 **"반환값을 쓰는가"**였다:
  #     `if (!confirm(x)) return;` → Promise 는 항상 truthy → 가드 무력화(터지지도 않아 더 위험)
  #     `alert(msg);`             → 값을 안 쓰므로 안전. gcc `$c.win.alert` 의 Promise executor 는
  #                                 **동기 실행**이라 await 없이도 대화상자가 즉시 뜬다(구현 확인).
  #   그래서 `auto_guard: statement_only` = **부모가 ExpressionStatement 일 때만** 치환한다.
  #   ⚠**축 구분**(2026-09-05 D27): 이 조건은 «as-is 코드를 자동 치환할지»를 말한다. 우리가 **새로 방출**할 때의
  #     형태는 ANTI-02(`await $c.win.alert|confirm`)가 따로 규정한다 — 둘은 충돌이 아니라 다른 축이다.
  #     방출 쪽은 `confirm` 미await 을 **생성 실패**로 세운다(반환값 가드 무력화).
  #   조건·대입·return 인자에 들어간 호출은 건너뛰고 계측이 센다(저작 몫).
  #
  #   `realized_by:` (2026-08-22 신설 — @spec 제안 채택): `auto:` 는 fnmap AST 자동 치환 여부만 말한다.
  #   auto:none 인데 **다른 층이 자동 실현**하는 행은 이 열이 그 층을 가리킨다 — 표만 훑고
  #   "수동"으로 오독하지 않도록. 값 = 실현 모듈/패스 이름.
