#   ⛔여기 이름으로 치환하지 않는다. 방향이 서면 `cm_fn_substitution_appendix` 로 올린다.
#
#   겹쳐 잰 값: @editor 가 krx-tobe/_meta/krx-convention-gap-census.tsv 로 낸 값과 **일치**한다
