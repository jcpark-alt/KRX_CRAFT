    adapter_note2: '⛔요소 갈래를 제거했다(2차 ① 2026-09-27). 종전 폴백 `(typeof ($1) === "object" && "value" in ($1)) ? (($1).value = …)` 은 **닿을 수 없는 코드**였다 — `$1` 이 컴포넌트면 `"value" in` 이 false 이고(전판 188자리/33화면 전건), 요소면 앞 가드의 `($1).setValue` 가 없어 이미 이 갈래로 오는데 그때도 `"value" in` 이 DOM 요소에는 true 라 동작하긴 했다. 그러나 이 이름을 `component_contract` 에 등재해 인자를 컴포넌트로 통일했으므로 요소 갈래 자체가 사라진다. ⛑등재 근거: 어댑터가 **컴포넌트 API 로만** 이루어져 있어 인자가 요소면 앞 가드가 항상 falsy → `void 0`(조용한 무동작). 전판 실측 `$c.util.fieldEl(…).setValue` 490자리/42화면 · `.getValue` 172자리/33화면이 그 꼴이었다.'
    adapter_note: 'as-is: numObj.value = fn_RmComma(numObj.value) — 인자가 **객체**(컴포넌트/필드)라 순수 unFormatNumber 로는 부수효과가 빠진다. 컴포넌트면 setValue, DOM 요소면 .value — 없으면 무동작(as-is 도 null 가드)'
