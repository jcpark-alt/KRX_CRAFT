# ── 행 동작 대응(2026-09-15) — «표 → 그리드» 승격 때 셀 안 동작을 **엔진 표준**으로 대체한다 ──
#   근거: as-is 함수 실물을 읽어 «this 의 쓰임»과 «몸통»을 갈랐다(docs/reviews/grid-cell-standard-20260914.md §6).
#     · `this` 는 **«눌린 행 찾기»에만** 쓰인다 → 그리드에서는 `rowIndex` 가 그 자리를 대신한다.
#     · 몸통은 «행 삭제»(`obj.parentNode.parentNode` → `removeChild`)와
#       «행 순서 이동»(`attachForm[i].innerHTML ↔ [i±1]`)뿐이다.
#   ⇒ 반입이 아니라 **대체**다(외부함수 방법론). 엔진 실물 시그니처로만 쓴다:
#     `dataList.removeRow(rowIndex)` — 작업본 -ref 실사용(`dlt_calc.removeRow(rowIndex)`)
#     `dataList.moveRow(from, to)`   — 엔진 번들 실측(wbd…main.js `prototype.moveRow=function(t,e)`;
#                                      범위 밖·음수면 스스로 무시하므로 첫/끝 행 가드가 따로 필요 없다)
#   ⛔여기에 없는 이름은 **대체하지 않는다** — 화면마다 이름을 지어내지 않는다(미실현 표기로 드러난다).
row_action_map:
  - { asis: fn_DelAttach,     kind: row_remove,    why: '첨부 행 삭제 — obj.parentNode.parentNode 제거 + 남은 수 0 이면 안내(uldmgt50006·50009 실물)' }
  - { asis: fn_DelProcess,    kind: row_remove,    why: '처리 행 삭제 — 같은 꼴(uldmgt50005 실물)' }
  - { asis: fn_DelByformAuth, kind: row_remove,    why: '권한 행 삭제 — 같은 꼴(uldmgt50015 실물)' }
  - { asis: fn_Down,          kind: row_move_down, why: '행 한 칸 아래로 — i ↔ i+1 innerHTML 맞바꾸기(마지막 행이면 as-is 도 return)' }
  - { asis: fn_Up,            kind: row_move_up,   why: '행 한 칸 위로 — i ↔ i-1(첫 행이면 as-is 도 return)' }

# ── KRX 표준 API 치환표 (2026-09-27 신설 · @spec) ─────────────────────────────
#   ★사용자 결정 2026-09-27 「KRX 에서 만든 표준 API 로 진행하는 안으로 가자」(갈래 B —
#     docs/plans/krx-delivery-master-plan-20260927.md 재개정 2). 우리 gcc 확장을 전달하지 않고,
#     산출이 부르는 «gcc 미존재 함수» 를 KRX gcc·컴포넌트 표준 API 로 치환해 전달한다.
#     전달 게이트 잣대 = 「우리 확장 호출 0」.
#
#   ⛔절을 «누구 몫인가»로 가른다(@editor 판정 2026-09-27):
#     `standard_api_map`           = **우리 몫** — 우리가 발명한 gcc 확장. 우리가 걷는다.
#     `cm_fn_substitution_appendix` = **그쪽 몫**(부록) — `$c.cm.fn_*` 중 §7.2 가 치환안을 준 9종.
#     `cm_fn_unmapped_appendix`     = **그쪽 몫**(부록) — `$c.cm.fn_*` 중 §7.2 목록 밖 19종, 방향 미정.
#   두 부록을 합쳐 `$c.cm.fn_*` 28종이 우리 산출에서 실제로 불린다(아래 계수 잣대).
#
#   ⛔이 표는 **처방**만 담는다 — 방출 구현은 @nexa17·@coder 몫이고, 여기에는 «표준 API 호출 꼴»
#     한 줄까지만 적는다(생성기 코드 조각·긴 배열 금지 — 도구 제작 원칙).
#   ⚠소비 상태: 로더(`apps/editor-web/lib/generate/load-generation-profile.ts:372~520`)는 아직 이
#     세 키를 읽지 않는다(2026-09-27 실측 — 읽는 키는 mappings·common_fn_map·derived_fn_map·
#     common_const_map·session_var_map·frame_api_map·row_action_map·substitution_arg_audit·
#     event_map·key_event_map·page_nav·asis_script_root). 배선은 @nexa17 방출분과 한 호흡이다.
#     그때까지 아래 `common_fn_map` 의 `$c.cm.fn_*` 9행은 **손대지 않았다** — 지금 `tobe` 를 바꾸면
#     로더 검증(`/^\$c\.[\w.]+$/`)에 걸려 행이 조용히 탈락하고 bare `fn_*` 가 그대로 남는다(무증상 회귀).
#     부록 각 행에 `superseded_by`(로더 미독 키)로 폐기 대상 짝만 표시한다 — 9종 전건이
#     `common_fn_map` 에 있다(실측 2026-09-27: common_fn_map 63행 중 9행).
#
#   계수 잣대(값 · 잰 판 · 재현 명령):
#     값 = 아래 각 행 `calls`/`screens` · 잰 판 = samples/krx-tobe (git 0a6c5d764b1, xml 2,217본)
#     재현 = python3 로 각 xml 에서 `\$c\.(cm|data|util)\.<이름>(?![A-Za-z0-9_])\s*\(` 정규식 계수,
#            화면 = samples/krx-tobe/<화면>/ 최상위 디렉터리 단위 유니크.
#     ⚠`fn_ChkNumber` 는 `fn_ChkNumber2` 를 먹지 않도록 `(?![A-Za-z0-9_])` 가 필수다(경계 없이 세면
#       775 로 합쳐진다).
#     합: 우리 확장 7종 37,441호출 · `$c.cm.fn_*` 28종 2,161호출(9종 1,213 + 19종 948).
#     ⚠전달 마스터플랜의 「2,161/131」 과 **호출 수는 맞고 화면 수는 다르다**(우리 유니크 112) — 화면
#       잣대가 다르므로 잇지 않는다.
#
#   등가 표기: equivalence: exact = 인자·반환·부수효과가 같다 / partial = 어긋나는 자리를 note 에 적었다.

# ═══ 우리 몫 — 우리 gcc 확장 (본표) ═══════════════════════════════════════════
#   as-is 시그니처 원천 = **우리 정의 실물**: 선언 catalog/gcc/krx-tobe.yaml(읽기만),
#   구현 krx-tobe/_meta/gcc-package/{data,util}.add.js(읽기만).
#   ⚠**종 수 실측 7종**(요청 문구 「16종」과 다르다 — 불명확 자리로 회신에 올렸다):
#     우리가 전달 동봉용으로 선언한 확장은 공개 15종 + 내부 보조 2종 = 17종이다
#     (krx-tobe/_meta/gcc-package/README-적재.md). 그중 **이 코퍼스가 실제로 부르는 것은 7종**이고,
#     나머지 10종(scopeRoot·buildGridStyleXml·registerButtonState·setButtonState·syncDataListColumns·
#     executeMfe·destroyChart·onpageunload·__destroyById·__escapeXmlAttr)은 **호출 0**이다
#     — 느슨한 문자열 grep 으로도 0(onpageunload 만 1파일 4건이나 엔진 `ev:onpageunload` 속성 꼴).
#     이 10종 계수·처분은 마스터플랜에서 @nexa17 몫(D8 잔여)이라 본표에 넣지 않았다.
#     「16종」이 §7 의 «미존재 16종(A 7 + B 9)»을 가리킨 것이라면 = 본표 7 + 부록 9 로 이 파일에 다 있다.
standard_api_map:
  - name: readValue
    owner: sdd
    asis: "$c.data.readValue(id, field, opt)"
    asis_signature: 'id = 데이터 컴포넌트 id · field = 필드(컬럼) 이름 · opt = { ctx, soft, silent, row, label }'
    asis_returns: '{Object} 값 — dataList 면 `getCellData(opt.row||0, field)`, dataMap 이면 `get(field)`(둘 다 있으면 row 유무로 갈림). 미해결 처분 3갈래: `silent` → ""(경고 없음) · `soft` → console.warn + "" · 그 밖 → **throw new Error("unresolved:"+label)**'
    asis_evidence: '선언 catalog/gcc/krx-tobe.yaml:814 · 구현 krx-tobe/_meta/gcc-package/data.add.js:50~72'
    tobe: 'dataMap: `dma_<dc>.get("<field>")` / dataList: `dlt_<dc>.getCellData(<row>, "<field>")`'
    tobe_evidence: '엔진 dataMap·dataList 표준 메서드(작업본 실사용 꼴)'
    arg_transform: 'id → 컴포넌트 id 그대로 · field → 문자열 인자 그대로 · opt.row → getCellData 첫 인자(기본 0) · opt.label → **탈락**(진단 표기용) · opt.ctx·soft·silent → 아래 note 의 처분'
    register: none
    calls: 27252
    screens: 1148
    equivalence: partial
    note: '★종류 판정 원천 = **C1 엔티티 `kind`**(`kind: data_map` / `kind: data_list` — 예: krx-tobe/specs/<화면>/C1-data-schema.yaml). 산출 마크업은 **대조용**이지 진실원이 아니다. C1 에 그 dc 가 없으면 **엔티티를 신설**하고 필드 = 스크립트가 참조하는 키로 채운다(사용자 결정 2026-09-27 「dataMap 을 만들어 넣고 치환표에 등록」) — 이때 **row 접근 꼴(opt.row 가 있거나 행 인덱스를 쓰는 자리)이면 dataList** 로 신설한다. ★`opt.ctx` 폴백은 **두 단**으로 다시 적는다: ⑴`dma_pageContext.get("<key>")` → ⑵그 key 가 G1 `page_variables[].name` 에 있는 이름일 때만 `scwin.<key>` → 둘 다 없으면 **진단**(조용한 undefined 금지). 구현의 현 폴백(`scwin.getParameter(field)` → `$p.getScope().scwin[field]`, data.add.js:64~68)은 이 두 단으로 대체된다. ★`opt.silent` 은 폴링 재시도 전제였다 — 표준 꼴에서는 **폴링을 걷고 「적재 완료 시점(tx 성공 뒤) 1회 평가」** 로 바꾸고, 그 1회에서 값이 비면 **진단**한다(빈값 무증상 금지). `opt.soft`/미지정(throw)의 «드러나게 실패» 성질은 유지한다.'
  - name: recvParamData
    owner: sdd
    asis: "$c.data.recvParamData(targetId, scopeObj)"
    asis_signature: 'targetId = 대상 dataMap id(생략 시 "dma_pageContext") · scopeObj = scope 정보 객체(생략 시 현재 화면)'
    asis_returns: '{Number} 채운 키 수 — `scwin.getParameter(undefined, scopeObj)` 로 **전체 파라미터 객체**를 받아 키마다 `dm.set(k, v)`. 전달 없음/대상 부재는 0(대상 부재는 console.warn)'
    asis_evidence: '선언 catalog/gcc/krx-tobe.yaml:794 · 구현 krx-tobe/_meta/gcc-package/data.add.js:14~36'
    tobe: '$c.data.getParameter() 결과를 대상 dataMap 에 `setJSON` — `dma_pageContext.setJSON($c.data.getParameter() ?? {})`'
    tobe_evidence: '~/Downloads/krx-0922-박지철/src/gcc/data.xml:924(JSDoc — 인자 없이 부르면 **전체 파라미터 값**) · dataMap `setJSON` 은 엔진 표준(산출 실사용 다수)'
    arg_transform: 'targetId → `dma_<...>` 컴포넌트 직접 참조(기본 `dma_pageContext`) · scopeObj → `$c.data.getParameter(key, scopeObj)` 둘째 인자로 살릴 수 있으나 산출 실물은 전건 생략 · 반환 키 수는 쓰이지 않는다'
    register: none
    calls: 4208
    screens: 2104
    equivalence: partial
    note: '⚠⑴**키 단위 set → 통째 setJSON** 으로 바뀐다. `set` 은 기존 키를 남기고 덮지만 `setJSON` 은 **객체 전체를 대치**한다 — 온로드 첫 수신 자리면 같고, 이미 값이 든 dataMap 에 부르면 다르다(산출 실물은 온로드 1회가 대세). ⑵대상 dataMap 이 없는 화면이 있다(§7.2: 14파일 dataMap 정의 추가 선행). C1 엔티티 신설이 선행이고, 없이 부르면 `setJSON` 이 미해결이다. ⑶§7.1 은 `$c.data.getParameter("paramData")`(고정 키)로 적었고 §7.4 는 전체 수신으로 적용했다 — **키 집합은 실환경 확인 잔여**(§7.4 「파라미터 키 집합 실환경 확인」).'
