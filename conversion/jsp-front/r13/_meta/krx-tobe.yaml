substitution_arg_audit:
  # ↓축소 실측 등재 (2026-08-30 krx-shrink-2) — 정의 전무 함수의 관용구 실현.
  #   사용형태 전수: `if(!chkPeriod_Emedit(f,t)){return}` — 실패 분기 무알림 = as-is 내부 알림.
  #   실현 = gcc diffDate 역전 검사 + 알림 + boolean. 문구는 잠정(as-is 실물 부재 — 실물 도착해도
  #   본 실현이 우선, 요청 철회 축).
  # ShowWin(grd)/CloseWin(rowcount,grd) — 그리드 로딩 표시 축 (2026-08-30 krx-shrink-2).
  #   사용형태 전수 균일: 조회 직전 ShowWin·적재 완료 CloseWin. gcc 실물이 같은 기능을 통신 레일에
  #   내장(__show/__hideGridSpinner — tx 직전 자동 표시·완료 시 자동 해제, 6142/6291/6437행)이라
  #   호출을 소거한다(이중 실행 방지). 0건 문구는 엔진 그리드 축(별도) — 시각 QA 시 재점검.
  # num2won(src, '대상id') — 금액 입력 시 한글 금액을 이웃 표기란에 쓴다 (2026-08-30 krx-shrink-6).
  #   gcc formatNumberKor 실물이 정확 대응. src 는 컴포넌트/DOM/jQuery 혼재라 3갈래 게터.
  #   1인자 변형($('#x') 단독)은 어댑터 미적용(스킵+진단 — 인자 의미 미상, 지어내지 않음).
