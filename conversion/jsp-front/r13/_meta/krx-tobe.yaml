# ── as-is 공통 JS 회수분 (2026-08-28 신설) ────────────────────────────────────
#   축: 셸(pcc/gcc)에는 없지만 **as-is 공통 JS 원본이 이미 반입돼 있는** fn_*.
#
#   출처 = `krx-tobe-commons/KRX_웹스퀘어_전환/WebContent/js/` — **47파일 / 377종 정의**.
#   앞서 "미제공 273종"으로 KRX 에 요청했던 것을 전수 재대조해 **102종/755화면을 회수**했다
#   (요청은 171종/779화면으로 정정 — docs/source-asset-requests.md).
#
#   ⚠**아직 배선되지 않았다.** 공통자원 번들 `krx-tobe-v1` 의 리소스는 `tobe-gcc.js`·`tobe-pcc.js`
#     뿐이고 이 102종은 **0종** 실려 있다. 반입 경로 = 새 리소스 + 스냅샷 재생성 + 핀 갱신(backlog #118).
#     그때까지 이 표는 **근거 박제**이지 소비 대상이 아니다 — 소비층을 붙이기 전에 번들부터 실어야 한다.
#
#   ⛔KRX 셸 pcc 에도 없다 = **KRX 도 아직 공급하지 않은 축**이다. 셸이 나중에 같은 이름을 노출하면
#     `common_fn_map`(셸 실물 우선)이 이깁니다 — 그때 이 표에서 해당 행을 뺀다.
