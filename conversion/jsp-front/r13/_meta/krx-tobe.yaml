# ── 이벤트명 대응 (2026-08-27) ─────────────────────────────────────────
#   as-is(gauce) 이벤트명을 그대로 `ev:on<이름>` 으로 내면 엔진이 **모르는 속성**이라 조용히 안 붙는다.
#   진실원 = **엔진 등록부 실측**(R1564 `uiplugin.tabControl.defaultOptions.userEvents`):
#     ["ontabclick","onchange","ontabclose","onbeforeselect","onbeforetabclose","onbeforetabmove",
#      "onaftertabmove","ondrawcomplete","ontabload","ontabsplit","onscrollleftbtnclick", …]
#   ⚠DeepSquare `codeRule/CodeRules.md` 는 `ev:ontabclick` 을 "이벤트 환각"으로 적고
#     `ontabindexchange` 를 쓰라고 하는데, **이 엔진에는 `tabindexchange` 가 없다**(전 번들 0건 ·
#     `tabclick` 24건 · `beforeselect` 24건). 가이드가 아니라 등록부를 따른다.
#   미등재 이름은 원명 유지 — 생성 진단(`G1 ev_targets 미배선`)이 드러낸다.
event_map:
  # 탭 전환 후 — as-is 는 인덱스를 받아 divid 를 보이고/숨긴다. onchange = 변경 **후** 발화라 안전.
  onselchanged: onchange
  # 탭 전환 **전** 거부 훅 — 엔진도 `false` 반환 시 전환을 취소한다(fireEvent 반환 검사 실측).
  preselchangenotify: onbeforeselect
  # 등록부 대조 추가분 (2026-08-27) — 아래 3종은 엔진 번들에 문자열조차 0건이라 속성이 무시된다.
  onselchange: onchange      # selectbox 15·select1 5·radio 2 — 등록부에 onchange 실재
  onkillfocus: onblur        # gridView 3·inputCalendar 1 — 등록부에 onblur 실재(gridView 는 미보유)
  onsetfocus: onfocus        # gridView 3 — 등록부에 onfocus 실재(gridView 는 미보유)
  # 단발 잔여 2종 (2026-08-27 재대조) — gridView 등록부에 의미가 같은 이벤트가 실재한다.
  oncancolumnposchange: onbeforecolumnmove   # 열 이동 거부 훅 — 양쪽 다 veto 축(gridView 30006)
  onlbuttondblclk: oncelldblclick            # 좌버튼 더블클릭 — §116(onrowdblclick 비실재) 정합(majornotice)
  # ⚠아래 4종은 **대응 불필요 — 엔진이 실제로 아는 이름**이다(자기정정 2026-08-27).
  #   `userEvents:[…]` 배열만 훑으면 미등재로 오판한다. 발화 지점(`fireEvent(...,"onX")`)과
  #   대소문자까지 봐야 한다:
  #     onitemclick 1  — `fireEvent(t,"onitemclick",s)` 실재(선택 항목 클릭)
  #     onInputValueChange 1 — upload `userEvents:["ondone","onInputValueChange"]` (대문자 표기!)
  #     onComplete 2   — multiupload `userEvents:["ondone","onComplete","onprogress","onerror"]`
  #     onpaste 439    — `addListener(render,"onpaste",…)` 로 직접 건다
  # ⚠`ev:submit`/`submitdone`/`submiterror` 는 `<xf:submission>` 표준 프로토콜 이벤트 — 플러그인 축 아님.
  # ── 대응 없음(저작 축) — 표에 억지로 넣지 않는다. 생성 진단이 화면별로 드러낸다. ──
  #  · gauce dataset `OnFilter` = **행마다 true/false 를 돌려주는 술어 콜백**(실측 30012·90500·30001·91000).
  #    엔진 dataList userEvents 에는 `onbeforecolumnfilterchange`/`onaftercolumnfilterchange` 뿐 —
  #    열 필터 UI 변경 알림이지 행 술어가 아니다. 구조가 달라 1:1 대치 불가 → 저작 판단(갭 §5).
  #  · gauce `gform.OnUnload` = 창 종료 훅(실측 07401 `fn_parentRefresh()`). to-be 는 팝업 반환 축
  #    (`closePopup` 콜백 — 스페셜리스트 §115)이 같은 일을 하므로 이벤트 대치가 아니라 반환 배선 몫.

# ── 이벤트명 대응 추가분 (2026-08-27 등록부 대조) ────────────────────
#   산출에 실제로 나간 `ev:` 이름 26종을 등록부 211종과 맞대 본 결과, 아래 3종은 **엔진 번들에
#   문자열조차 없다**(0건) — 속성이 조용히 무시돼 핸들러가 한 번도 안 불린다. 실측 29건.
#     onselchange 22(selectbox 15·select1 5·radio 2) · onkillfocus 4(gridView 3·inputCalendar 1)
#     · onsetfocus 3(gridView 3)
#   ⚠`onsubmit` 146(xf:group)은 **그대로 둔다**: 본문이 전부 `return false`(as-is 네이티브 제출
#     차단 가드)이고 to-be 는 네이티브 제출 자체가 없어 결과가 같다. 무해한 잔재.
#   ⚠gridView 에는 blur/focus 계열 등록 이벤트가 없다(등록부 확인) — 그 3+3 건은 대응해도 여전히
#     무발화지만, 같은 이름을 쓰는 다른 컴포넌트(inputCalendar 등)는 살아난다. 손해 없음.

# ── 키 이벤트 조회 (2026-08-28, 사용자 지시 "작업본에서 처리 방향 찾아봐") ──────────
#   as-is 는 `window.event.keyCode` / `event.keyCode` / `e.keyCode || e.which` 로 키를 읽는다.
#   ⚠이걸 "as-is 원문이라 협의 축"으로 보고했던 것은 **오판**이었다 — **KRX 가 공용함수를 이미 제공**한다:
#     `krx-tobe-commons/KRX_웹스퀘어_전환/gcc/util.xml`
#       scwin.getKeyCode = function (e) { return e.key || e.keyCode || e.which; };
#       @example  $c.util.getKeyCode(event);   // "Enter" 또는 13
#   gcc 사전에도 등재돼 있다(catalog/gcc/krx-tobe.yaml — callName `$c.util.getKeyCode`).
#   실측 규모: event.keyCode 153 · .which 92 · window.event.keyCode 80 · e.keyCode 24 = 349건 / 256화면.
#   ⚠`window.event.keyCode` 는 MZ031(window 객체 사용)에도 잡히던 자리 — 대응 이관이 규칙까지 함께 푼다.
key_event_map:
  - asis: window.event.keyCode
    tobe: $c.util.getKeyCode(event)
    note: 래퍼가 `var event = ev` 를 이미 두므로 인자 `event` 가 실재
  - asis: event.keyCode
    tobe: $c.util.getKeyCode(event)
  - asis: <이벤트변수>.keyCode
    tobe: $c.util.getKeyCode(<이벤트변수>)
  - asis: <이벤트변수>.keyCode || <이벤트변수>.which
    tobe: $c.util.getKeyCode(<이벤트변수>)
    note: 관용구 전체를 한 호출로 접는다(공용함수가 key·keyCode·which 3단 폴백을 이미 보유)

# ── 프레임 API (2026-08-28) ────────────────────────────────────────────
#   as-is gauce `frame.*` 는 to-be 에 **KRX 가 이미 구현해 둔 것**이 있다:
#     구현 실물 = `krx-tobe-commons/KRX_셸_대외프로젝트/src/main/webapp/cm/pcc/frame.xml`
#       scwin.Provider(path) / CloseFrame() / CreateDialogFrame() / CreateFrame() /
#       FrameShow() / SetEvent() / focus() / parent() / path(path)
#     gcc 사전 등재 = catalog/gcc/krx-tobe.yaml (`$c.frame.*` 9종)
#   ⚠"대응표에 없다"고 판단했던 것은 **오판**이었다 — function-map 만 보고 **gcc 사전을 안 봤다**
#     (같은 실수를 getKeyCode 에서도 했다). "대응 없음" 판정 전에 gcc 사전을 반드시 훑을 것.
#   미포팅 시 증상: `ReferenceError: frame is not defined` → 진입점 catch → **"처리 중 오류" 팝업**.
#     실측 131화면(진입 오류 191화면 중 최대 축).
#   실측 호출 분포: Provider 188 · CreateDialogFrame 96 · CloseFrame 84 · srcUrl 20 ·
#     fn_setSelectedData 15 · FrameID 8 · setCorpInfo 8 · OuterWindow 5 · Width/Height 각 4
frame_api_map:
  - asis: frame.Provider
    tobe: $c.frame.Provider
    note: 인자 그대로(`"../"`·`"/top"`). 본문이 $p.top()/`$c.frame.path` 로 분기 — 실물 확인
  - asis: frame.CloseFrame
    tobe: $c.frame.CloseFrame
  - asis: frame.CreateDialogFrame
    tobe: $c.frame.CreateDialogFrame
  - asis: frame.CreateFrame
    tobe: $c.frame.CreateFrame
  - asis: frame.FrameShow
    tobe: $c.frame.FrameShow
  - asis: frame.SetEvent
    tobe: $c.frame.SetEvent
  - asis: frame.focus
    tobe: $c.frame.focus
  - asis: frame.parent
    tobe: $c.frame.parent
  - asis: frame.path
    tobe: $c.frame.path
  # 속성 접근 축 (2026-08-29 재판정 — §126 순위: 실물 재확인) — pcc frame.xml 이 **자리표시자로
  #   실제 노출한다**: `scwin.srcUrl = ""` · FrameID · Width · Height (선언부만 보고 "대응 없음"으로
  #   잘못 판정했었다). KRX 가 전환 코드가 죽지 않도록 이름을 남긴 것 — 배선하면 크래시
  #   (`frame is not defined`) → 조용한 빈 값(KRX 의도)이 된다. 값이 필요한 자리(URL 파라미터
  #   파싱)는 파라미터 수신 축($c.data.getParameter)이 따로 맡는다.
  - asis: frame.srcUrl
    tobe: $c.frame.srcUrl
    note: pcc 자리표시자 "" — 크래시 방지 배선. 파라미터는 getParameter 축이 정본
  - asis: frame.FrameID
    tobe: $c.frame.FrameID
  - asis: frame.Width
    tobe: $c.frame.Width
  - asis: frame.Height
    tobe: $c.frame.Height
  # ⚠잔여 미배선(지어내지 않는다): frame.OuterWindow 5 — pcc 에 이름조차 없음.
  #   frame.fn_setSelectedData 15 · frame.setCorpInfo 8 = **화면 저작 함수**(프레임 객체 경유
  #   호출 — 로컬 frame 변수라 포팅 패스가 shadow 로 걸러 보존, 정상)

# ── KRX 제공 공통함수 배선 (2026-08-28 신설) ──────────────────────────────────
#   축: as-is 화면이 **정의 없이 부르던** `fn_*` → 셸이 실제로 노출하는 `$c.<모듈>.<원래이름>`.
#
#   진실원 = **셸 `config.js` 의 모듈 등록표**(`@name` ↔ `@src`)와 그 파일의 실물 구현. 둘 다 실측이다:
#     krx-tobe-commons/KRX_셸_대외프로젝트/src/main/webapp/websquare/config.js  (18모듈)
#       /cm/pcc/common.xml → $c.cm · /cm/pcc/list_common.xml → $c.lc · /cm/pcc/fil.xml → $c.fil
#   전수 대조: 정의 없이 호출되는 fn_* **316종/2,019화면** 중 셸 실물 보유 = **43종/485화면**(이 표).
#
#   ⚠**정정 2026-09-27 — 위 「셸 실물 보유 43종」 근거는 8/21 반입본이다.** KRX 는 9/21 pcc 를 정비했고
#     (`fn_` 접두 제거·camelCase·모듈별 트리), 9/22 전달본에는 `fn_Trim=`·`fn_IsExceedMaxLen=`·`fn_CheckDate=`
#     정의가 **0** 이다(@editor 실측 09-27 · 내 대조: 9/09 전달본 `gcc-unzip` 에 `scwin.trim`·`getByteLength`·
#     `checkCalendarFormat` 는 있고 `fn_Trim` 은 없다). 박지철 §7.2 도 「정의 없음 — gcc 대체가 정답」이다.
#     ⇒ **런타임 부재**다: `$c.cm.fn_*` 는 죽는 호출이다. B9 6종(fn_Trim·fn_CheckDate·fn_IsExceedMaxLen·
#     fn_SelEmail·fn_SetPhoneValue·fn_SetEmaileValue)은 **치환**하고, 나머지는 Q-1(사용자 결정)로 남긴다.
#     ⛔행은 지우지 않는다 — 8/21 실물이 무엇이었는지가 판정 근거로 계속 필요하다(as-is 의미의 진실원).
#   나머지 273종/1,534화면은 실물이 없다 → KRX 요청 목록(docs/source-asset-requests.md).
#
#   ⚠**정본 치환표(krx-substitution.yaml)와 9행이 갈린다 — 이 표가 이긴다.** 근거는 실물이다:
#     · `fn_NullChk(_obj)` 는 값이 비면 **$c.win.alert + focus** 후 true 를 반환한다. 정본의
#       `$c.util.isEmpty` 는 순수 판정이라 **부수효과가 사라진다**(경고도 포커스도 안 난다 = 잠복 회귀).
#     · `fn_IsExceedMaxLen(_obj)` 는 **boolean**, 정본의 `$c.str.getByteLength` 는 **number** 다. 인자도
#       컴포넌트 vs 문자열이다. 반환 의미가 반대로 쓰이면 입력 검증이 통째로 뒤집힌다.
#     정본은 "as-is 기능을 gcc 어휘로 **재작성**" 축이고, 이 표는 "as-is 함수를 **그대로 이식**" 축이다.
#     셸이 원본 그대로를 pcc 에 실어 두었으므로 **무손실 경로가 존재**한다 — 그것을 쓴다.
#     작업본 실측이 이를 뒷받침한다: `$c.cm.fn_NullChk` 58건 · `$c.cm.fn_IsExceedMaxLen` 30건
#     (20260821_KRX_Conversion — 정본 표기는 0건).
#
#   `working_sample:` = 작업본이 쓴 표기. **셸과 다르면 셸을 따른다** — `$c.stf`·`$c.lce` 는 우리
#     config.js 에 등록이 없어 undefined 로 죽는다. 작업본이 모듈을 개명(fil→stf · lc→lce)한 것으로
#     보이며, KRX 가 셸 config 를 갱신하면 이 열을 따라 옮긴다(backlog #116).
#
#   ⛔화면이 스스로 정의한 `fn_*`(`scwin.fn_Search = function`)은 **치환 대상이 아니다** — 소비층은
#     "그 화면에 정의가 없을 때만" 치환한다. 작업본 실측으로도 자체정의 bare 가 913건이다.
common_fn_map:
  - asis: fn_msgResultForSave
    tobe: 응답 그릇 resultMsg 읽어 알림
    screens: 16
    impl: js/elw.js
    params: ''
    realize: inline
  - asis: fn_CheckTrnsmYn
    tobe: 컴포넌트 trnsmYn getValue() 판정 + 알림
    screens: 19
    impl: js/prelist.js
    params: ''
    realize: inline
  - asis: fn_CheckMaxLength
