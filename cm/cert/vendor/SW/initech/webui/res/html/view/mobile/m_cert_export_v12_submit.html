<meta charset="UTF-8">
<script type="text/javascript">
    $(document).ready(function() {
		// 메세지 공통 처리
		var langtype = sessionStorage.getItem("lang");
		if(langtype === "KOR" || !langtype){
			$('#INI_cert_export_v12_submit_title').text("인증서 내보내기");												// 로그인 
			$('.prev').html('<img src="/SW/initech/webui/res/img/mobile/common/dum_btn_prev.png" alt="처음으로 이동" />');
			$('#msg_cert_search_login').html('브라우저 인증서만 제출 가능합니다. 스마트폰 앱에서 사용하시는 인증서는 사용하 실 수 없습니다.<br>브라우저에 인증서가 없는 경우 <em>기기간 인증서 복사</em>를 통하여 인증서를 가져오시기 바랍니다.</b>');
		}
		else if(langtype === "ENG"){
			$('#INI_cert_export_v12_submit_title').text("Cert Export");												// 로그인 
			$('.prev').html('<img src="/SW/initech/webui/res/img/mobile/common/dum_btn_prev.png" alt="Prev" />');
			$('#msg_cert_search_login').html('If there is no certificate to be used,<br><b><em>login by finding a certificate.</em></b>');
		}
       
    
     });
        
	</script>
	
<div class="m-initech-certificate-wrap" id="m-initech-certificate-wrap">
	 <header class="sticky"><!-- 헤더 고정 클래스 -->
	     <div class="inner-wrap">
	         <h1 id="INI_cert_export_v12_submit_title" ></h1>
			<a class="prev" id="INI_PRIV_BTN"></a>
	     </div>
	 </header>
	<section class="m-ini-cert-cont" >
		<div class="inner-wrap">
			<!-- 인증서 목록 -->
			<div class="m-ini-cert-list" id="INI_M_CERTLIST"></div>
			<!-- // 인증서 목록 -->
			<!-- 인증서 찾기 -->
	         <div class="m-ini-cert-more" id="INI_M_SEARCH">
	                 <a id="msg_cert_search_login"></a>
	         </div>
	         <!-- // 인증서 찾기 -->
		</div>
	</section> <!-- // .cert-contents --> 
    </div> <!-- // .m-initech-certificate-wrap -->
