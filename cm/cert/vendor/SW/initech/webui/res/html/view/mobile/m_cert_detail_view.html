<!-- 인증서 발급 -->
<meta charset="UTF-8">
<script type="text/javascript">
    $(document).ready(function() {
        // 메세지 공통 처리
        var langtype = sessionStorage.getItem("lang");
        if(langtype === "KOR" || !langtype){
            $('#INI_cert_detail_view_title').text("공동인증서인증");
            $('.prev').html('<img src="/SW/initech/webui/res/img/mobile/common/dum_btn_prev.png" alt="인증서 리스트 창 이동" />');
            $('.sect-title').text("현재 인증서 암호를 입력해 주세요.");
            $('#INI_cert_detail_view_cancel').text("취소");
            $('#INI_cert_detail_submit').text("확인");
        }
        else if(langtype === "ENG"){
            $('#INI_cert_detail_view_title').text("Login");
            $('.prev').html('<img src="/SW/initech/webui/res/img/mobile/common/dum_btn_prev.png" alt="prev" />');
            $('.sect-title').text("Enter current password for certificate.");
            $('#INI_cert_detail_view_cancel').text("cancel");
            $('#INI_cert_detail_submit').text("Confirm");
        }

    
     });
        
    </script>
<div class="m-initech-certificate-wrap" id="m-initech-certificate-wrap">
    <header class="sticky">
        <div class="inner-wrap">
            <h1 id="INI_cert_detail_view_title" ></h1>
			<a  class="prev" id="INI_PRIV_BTN"></a>
        </div>
    </header>
    <section class="m-ini-cert-cont">
        <div class="inner-wrap">
            <!-- 인증서 목록 -->
            <div class="m-ini-cert-list cert-select" id="INI_cert_single"></div>
            <!-- // 인증서 목록 -->
            <!-- 인증서 암호입력 -->
			<form id="keypadFrm" name="keypadFrm" method="post">
            
            <div class="m-ini-cert-password">
                <h2 class="sect-title"></h2>
                <div class="input-wrap">
                	<input type="password" title="password" id="ini_cert_pwd" name="ini_cert_pwd" autocomplete="off"/>
               	</div>
            </div>
            
            </form>
            <!-- // 인증서 암호입력 -->
            <!-- 버튼 영역 -->
            <div class="m-ini-cert-btns">
                <span><a id="INI_cert_detail_view_cancel"></a></span>
                <span>&nbsp;</span>
                <span><a class="emp" id="INI_cert_detail_submit"></a></span>
            </div>
            <!-- // 버튼 영역 -->
        </div>
    </section> <!-- // .cert-contents -->
</div> <!-- // .m-initech-certificate-wrap -->
<div id="w2ui-popup-uniwebkey"> 
</div>
