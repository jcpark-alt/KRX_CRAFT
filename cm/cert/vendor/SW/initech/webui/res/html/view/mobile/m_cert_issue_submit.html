<meta charset="UTF-8">
<script type="text/javascript">
	$(document).ready(function() {
		// 메세지 공통 처리
		$('#INI_cert_modal_title').text("인증서 발급");												// 로그인 
		$('.prev').html('<img src="/SW/initech/webui/res/img/mobile/common/dum_btn_prev.png" alt="인증서 신규발급 페이지로 이동" />');
		$('#ini_cert_pwd_label').text("새로운 인증서 암호를 입력해 주세요.");
		$('#ini_cert_new_pwd_cnf_label').text("새로운 인증서 암호를 재입력해 주세요.");
		$("#INI_newCertPw").attr("placeholder" , "새로운 인증서 암호를 입력해 주세요.");
		$("#INI_newCertPw_cf").attr("placeholder" , "인증서 암호를 재입력해주세요");
		$('#INI_certSubmit').text("확인");	
		$('#msg_cancel').text("취소");			
	 });
	</script>
<div class="m-initech-certificate-wrap" id="m-initech-certificate-wrap">
	<header class="sticky">
		<!-- 헤더 고정 클래스 -->
		<div class="inner-wrap">
			<h1 id="INI_cert_modal_title"></h1>
			<a class="prev" id="INI_cert_issue_prev"></a>
		</div>
	</header>
	<section class="m-ini-cert-cont">
		<div class="inner-wrap">
			<!-- 인증서 목록 -->
			<div class="m-ini-cert-list cert-select" id="INI_cert_single"></div>
			<!-- // 인증서 목록 -->
			<!-- 인증서 암호입력 -->
			<form id="keypadFrm" name="keypadFrm" method="post">
				<div class="m-ini-cert-password">
					<h2 class="sect-title" id = "ini_cert_pwd_label"></h2>
					<div class="input-wrap">
						<input type="password" title="password" class="msg_placeholder" id="INI_newCertPw" name="INI_newCertPw" autocomplete="off" />
					</div>
					<h2 class="sect-title" id= "ini_cert_new_pwd_cnf_label"></h2>
					<div class="input-wrap">
						<input type="password" title="password" class="msg_placeholder" id="INI_newCertPw_cf" name="INI_newCertPw_cf" autocomplete="off" />
					</div>
				</div>
			</form>
			<!-- // 인증서 암호입력 -->
			<!-- 버튼 영역 -->
			<div class="m-ini-cert-btns">
				<span class="btn_back">
					<a id="msg_cancel" ></a>
				</span> 
				<span>&nbsp;</span> 
				<span>
					<a  class="emp" id="INI_certSubmit"> </a>
				</span>
			</div>
			<!-- // 버튼 영역 -->
		</div>
	</section>
</div>
<div id="w2ui-popup-uniwebkey"> 
</div>
