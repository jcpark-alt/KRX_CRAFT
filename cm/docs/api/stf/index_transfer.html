<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stf → gcc 공통이관 함수 매핑 가이드</title>
<style>
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
       color:#1f2933; background:#fff; line-height:1.6; }
code { font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace; font-size:.9em; }
.layout { display:flex; min-height:100vh; }
.sidebar { width:300px; flex:0 0 300px; border-right:1px solid #e4e7eb; background:#f7f9fc;
           height:100vh; position:sticky; top:0; overflow-y:auto; padding:16px 0; }
.brand { padding:0 18px 12px; }
.brand h1 { font-size:15px; margin:0 0 4px; }
.brand .sub { font-size:12px; color:#7b8794; }
.search { margin:8px 14px 12px; }
.search input { width:100%; padding:8px 10px; border:1px solid #cbd2d9; border-radius:6px; font-size:13px; }
.nav-file { padding:6px 18px 2px; font-size:12px; font-weight:700; color:#243b53; }
.nav a { display:block; padding:3px 18px 3px 28px; font-size:12px; color:#627d98; text-decoration:none;
         white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.nav a:hover { color:#102a43; background:#eef2f7; }
.content { flex:1 1 auto; padding:28px 40px; max-width:1000px; }
.content > h1 { font-size:22px; margin:0 0 2px; }
.content > .summary { color:#7b8794; margin:0 0 24px; font-size:13px; }
.file-group { margin-bottom:34px; }
.file-group > h2 { font-size:16px; border-bottom:2px solid #102a43; padding-bottom:6px; margin:0 0 16px; }
.card { border:1px solid #e4e7eb; border-radius:8px; padding:14px 16px; margin-bottom:12px; background:#fff; }
.map-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.asis { color:#b45309; background:#fff7ed; border:1px solid #fed7aa; padding:3px 9px; border-radius:5px; font-weight:600; }
.arrow { color:#9aa5b1; font-weight:700; }
.tobe { color:#2563eb; background:#eff6ff; border:1px solid #bfdbfe; padding:3px 9px; border-radius:5px;
        font-weight:600; text-decoration:none; }
.tobe:hover { background:#dbeafe; text-decoration:underline; }
.tobe .ext { font-size:10px; color:#60a5fa; margin-left:3px; }
.badge { font-size:11px; padding:1px 7px; border-radius:10px; }
.badge.review { background:#fef9c3; color:#854d0e; }
.badge.replace { background:#fce7f3; color:#9d174d; }
.desc { margin:8px 0 0; color:#486581; font-size:13px; }
.note { margin:4px 0 0; color:#9aa5b1; font-size:12px; }
.legend { font-size:12px; color:#627d98; margin-top:6px; }
.legend .asis, .legend .tobe { padding:1px 6px; font-weight:600; }
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <div class="brand">
    <h1>stf → gcc 공통이관 매핑</h1>
    <div class="sub" id="sub"></div>
  </div>
  <div class="search"><input id="search" type="search" placeholder="AS-IS / TO-BE 검색..." autocomplete="off"></div>
  <nav class="nav" id="nav"></nav>
</aside>
<main class="content">
  <h1>stf → gcc 공통이관 함수 매핑 가이드</h1>
  <p class="summary" id="summary"></p>
  <p class="legend">
    <span class="asis">AS-IS(레거시)</span> <span class="arrow">→</span>
    <span class="tobe">TO-BE(gcc 표준)</span> — TO-BE 클릭 시 <code>gcc/index.html</code> 의 해당 함수 위치로 새 탭 이동.
  </p>
  <div id="main"></div>
</main>
</div>

<script>
// ins_function_analysis_report.md 의 [공통이관] 대표 함수 (AS-IS → TO-BE)
const GCC_INDEX = "../gcc/index.html";
const DATA = [
  { file:"utils.xml", asis:"cGetToday / cGetToday2", desc:"현재 일자 취득 — 서버 기준으로 전환(규칙 18 계열). 포맷 표기 변환(yyyymmdd→기본 인자 생략, yyyy-mm-dd→yyyy-MM-dd, hh:mm:ss→HH:mm:ss)", tobe:"$c.date.getServerDateTime", tag:"검토" },
  { file:"utils.xml", asis:"cGetPlusDate / cGetPlusDate2 / cGetMinusDate / cGetMinusDate2 / calcDate", desc:"일(日) 가감산 (감산은 부호 반전)", tobe:"$c.date.addDate" },
  { file:"utils.xml", asis:"cGetPlusMonth / cGetMinusMonth / calcMonth", desc:"월(月) 가감산 (감산은 부호 반전)", tobe:"$c.date.addMonth" },
  { file:"utils.xml", asis:"cGetPlusYear / cGetMinusYear / calcYear", desc:"년(年) 가감산 (감산은 부호 반전)", tobe:"$c.date.addYear" },
  { file:"utils.xml", asis:"cGetDifTodayInputday / cGetDifTodayInputdayBnd", desc:"두 날짜 차이 일수", tobe:"$c.date.diffDate" },
  { file:"utils.xml", asis:"cGetMaxDay", desc:"해당 월 마지막 일수", tobe:"$c.date.getLastDateOfMonth" },
  { file:"utils.xml", asis:"cIsLeafYear", desc:"윤년 검사", tobe:"$c.date.isLeafYear" },
  { file:"utils.xml", asis:"fn_get_nowDate", desc:"현재 일자 (클라이언트 → 서버 기준 전환)", tobe:"$c.date.getServerDateTime", tag:"검토" },
  { file:"utils.xml", asis:"cParseDate", desc:"yyyyMMdd 문자열 → Date 객체", tobe:"$c.date.dateUnFormat", tag:"검토" },
  { file:"utils.xml", asis:"isDate", desc:"8자리 일자 유효성 — AS-IS 는 빈값 true(통과), gcc 는 빈값 false 라 빈값 선행 처리 필요. 명칭 알림은 3번째 인자 objName", tobe:"$c.date.isDate", tag:"검토" },
  { file:"utils.xml", asis:"replaceAll", desc:"문자열 전체 치환", tobe:"$c.str.replaceAll" },
  { file:"utils.xml", asis:"cRmString", desc:"특정 문자 제거 — AS-IS 는 정규식 해석(이스케이프 주의), 치환 시 replaceAll(str, ch, "")", tobe:"$c.str.replaceAll", tag:"검토" },
  { file:"utils.xml", asis:"lpad", desc:"왼쪽 패딩", tobe:"$c.str.lpad" },
  { file:"utils.xml", asis:"cGetZero", desc:"0 패딩 — lpad(값, 길이, "0") 형태로 치환", tobe:"$c.str.lpad", tag:"검토" },
  { file:"utils.xml", asis:"email_chk", desc:"이메일 형식 검증", tobe:"$c.str.isEmail" },
  { file:"utils.xml", asis:"cIsJumin", desc:"주민등록번호 검증 — AS-IS 는 컴포넌트/문자열 혼용 입력이라 값 추출 후 치환", tobe:"$c.str.isSSN", tag:"검토" },
  { file:"utils.xml", asis:"cIsBupin", desc:"사업자등록번호 검증", tobe:"$c.str.isBizID", tag:"검토" },
  { file:"utils.xml", asis:"cIsResno", desc:"법인등록번호 검증 — 검증 자리수 확인 후 치환", tobe:"$c.str.isCorpNum", tag:"검토" },
  { file:"utils.xml", asis:"isNum", desc:"숫자(0-9) 여부", tobe:"$c.num.isNumber" },
  { file:"utils.xml", asis:"toNum", desc:"숫자 변환(실패 시 기본값) — 기본값 인자 처리 확인", tobe:"$c.num.parseFloat", tag:"검토" },
  { file:"utils.xml", asis:"FormatTofixed", desc:"소수 고정 자릿수 — AS-IS 는 문자열(toFixed) 반환, 반환형 확인", tobe:"$c.num.round", tag:"검토" },
  { file:"utils.xml", asis:"isEmpty", desc:"빈 값(null/공백) 판별", tobe:"$c.util.isEmpty" },
  { file:"utils.xml", asis:"cIsNull", desc:"빈 값 판별 — "NaN"/"undefined" 문자열 케이스 차이 확인", tobe:"$c.util.isEmpty", tag:"검토" },
];

// $c.<ns>.<fn> → gcc/index.html 앵커(m-<ns>-<fn>, 와일드카드는 모듈 섹션 mod-<ns>)
function toAnchor(tobe) {
  const m = tobe.match(/\$c\.([a-z]+)\.([A-Za-z0-9_*]+)/);
  if (!m) return null;
  return (m[2] === "*") ? ("mod-" + m[1]) : ("m-" + m[1] + "-" + m[2]);
}
function esc(s) { return (s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function tobeLink(tobe) {
  const anchor = toAnchor(tobe);
  const href = GCC_INDEX + (anchor ? "#" + anchor : "");
  return '<a class="tobe" href="' + href + '" target="_blank" rel="noopener" title="gcc/index.html 에서 보기">'
       + esc(tobe) + '<span class="ext">↗</span></a>';
}

function render() {
  const files = [];
  DATA.forEach(d => { if (files.indexOf(d.file) === -1) files.push(d.file); });

  document.getElementById("summary").textContent =
    "참조: ins_function_analysis_report.md · 공통이관 대표 " + DATA.length + "건 · 연동 타겟: gcc/index.html";
  document.getElementById("sub").textContent = DATA.length + "건 · " + files.length + "개 원본 파일";

  // sidebar
  let nav = "";
  files.forEach(f => {
    nav += '<div class="nav-file">' + esc(f) + '</div>';
    DATA.forEach((d, i) => {
      if (d.file === f) nav += '<a href="#card-' + i + '">' + esc(d.asis) + '</a>';
    });
  });
  document.getElementById("nav").innerHTML = nav;

  // main cards grouped by file
  let main = "";
  files.forEach(f => {
    main += '<section class="file-group"><h2>' + esc(f) + '</h2>';
    DATA.forEach((d, i) => {
      if (d.file !== f) return;
      const tag = d.tag
        ? ' <span class="badge ' + (d.tag === "대체" ? "replace" : "review") + '">' + esc(d.tag) + '</span>'
        : "";
      const search = esc((d.asis + " " + d.tobe + " " + d.desc).toLowerCase());
      main += '<article class="card" id="card-' + i + '" data-search="' + search + '">'
            + '<div class="map-row"><code class="asis">' + esc(d.asis) + '</code>'
            + '<span class="arrow">→</span>' + tobeLink(d.tobe) + tag + '</div>'
            + '<p class="desc">' + esc(d.desc) + '</p>'
            + '</article>';
    });
    main += '</section>';
  });
  document.getElementById("main").innerHTML = main;
}
render();

// 검색 필터 (AS-IS / TO-BE / 설명)
const box = document.getElementById("search");
box.addEventListener("input", () => {
  const v = box.value.trim().toLowerCase();
  document.querySelectorAll(".card").forEach(c => {
    c.style.display = (!v || c.dataset.search.indexOf(v) !== -1) ? "" : "none";
  });
  document.querySelectorAll(".file-group").forEach(g => {
    const any = [...g.querySelectorAll(".card")].some(c => c.style.display !== "none");
    g.style.display = (!v || any) ? "" : "none";
  });
});
</script>
</body>
</html>
