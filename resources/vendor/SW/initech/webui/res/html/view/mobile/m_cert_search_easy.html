<meta charset="UTF-8">
<script type="text/javascript">
    $(document).ready(function() {
        // 메세지 공통 처리
        var langtype = sessionStorage.getItem("lang");
        if(langtype === "KOR" || !langtype){
            $('#INI_search_easy_title').text("인증서 가져오기");
            $('#msg_cert_search_title').html('<p>프로그램 화면에 표시된 인증번호를<br> 입력하시고, 다음 버튼을 터치 해 주세요.</p>');												
            $('.prev').html('<img src="/SW/initech/webui/res/img/mobile/common/dum_btn_prev.png" alt="인증서 리스트 창 이동" />');
            $("#INI_cert_import_icon").html('<img src="/SW/initech/webui/res/img/mobile/common/dum_cert_export.png" alt="">');
            $('#INI_certSearchSubmit').text("다음");
            $('#INI_search_easy_cancel').text("취소");
            $("#msg_noti1").html('<i class="num">1</i>PC에서 모바일 웹/앱으로 접속하신 후 공동인증센터의 <em>‘스마트폰 인증서복사  → 기기(브라우저)간 복사’→기기간 인증서 내보내기</em> 버튼을 선택하시기 바랍니다.');
            $("#msg_noti2").html('<i class="num">2</i>PC에 복사할 인증서 암호를 입력 → 모바일에서 <em>인증번호 8자리를 입력</em>하시고 다음 버튼을 선택하시기 바랍니다.');
            $("#msg_noti3").html('<i class="num">3</i>PC에서 스마트폰으로 인증서 복사 완료 시 <em>스마트폰 및 PC에서 완료 안내를 확인</em>하시기 바랍니다.');
        }
        else if(langtype === "ENG"){
            $('#INI_search_easy_title').text("Cert Import");
            $('#msg_cert_search_title').html('<p>Enter authentication code displayed on the program screen and touch Next button.</p>');												
            $('.prev').html('<img src="/SW/initech/webui/res/img/mobile/common/dum_btn_prev.png" alt="back" />');
            $("#INI_cert_import_icon").html('<img src="/SW/initech/webui/res/img/mobile/common/dum_cert_export.png" alt="">');
            $('#INI_certSearchSubmit').text("Next");
            $('#INI_search_easy_cancel').text("Cancel");
            $("#msg_noti1").html('<i class="num">1</i>Connect to Internet Banking website on PC and open <em>‘Copy Certificate to a Smart Phone → Export Certificate to a Device’</em> menu on the main screen.');
            $("#msg_noti2").html('<i class="num">2</i>Enter password for the certificate to be copied onto PC, <em>enter the 8-digit authentication code</em> above, and press Next button.');
            $("#msg_noti3").html('<i class="num">3</i>After copying the certificate from smart phone to PC, <em>check the completion message on smart phone and PC</em>.');
        }

    
     });
    </script>
<div class="m-initech-certificate-wrap" id="m-initech-certificate-wrap">
    <header class="sticky">
        <div class="inner-wrap">
            <h1 id="INI_search_easy_title"></h1>
            <a class="prev"></a>
        </div>
    </header>
    <section class="m-ini-cert-cont" id="INI_cert_import_cont">
        <div class="inner-wrap">
            <!-- 인증서 찾기 -->
            <div class="m-ini-search simple">
                <div class="m-ini-cert-manage import">
                    <p id='msg_cert_import_title_msg'></p>
                    <span class="icon import" id="INI_cert_import_icon"></span>
                    <div class="table">
                        <span class="input-wrap"><input id="INI_authNum_1" name="INI_authNum" type="number" pattern="[0-9]*" maxlength="4" oninput="INI_maxLengthCheck(this);" onkeydown="return INI_onlyNumber(event)" onkeyup="INI_removeChar(event)" ></span>
                        <span>&nbsp;</span>
                        <span class="input-wrap"><input id="INI_authNum_2" name="INI_authNum" type="number" pattern="[0-9]*" maxlength="4" oninput="INI_maxLengthCheck(this);" onkeydown="return INI_onlyNumber(event)" onkeyup="INI_removeChar(event)" ></span>
                    </div>
                </div>
            </div>
            <!-- // 인증서 찾기 -->
            <!-- 버튼 영역 -->
            <div class="m-ini-mcert-btns">
	            <span><a  class="emp w50p" id="INI_certSearchSubmit"></a></span>
	        </div>
            <!-- // 버튼 영역 -->
            <ul class="panel notice">
                <li id="msg_noti1"><i class="num" >1</i></li>
                <li id="msg_noti2"><i class="num">2</i></li>
                <li id="msg_noti3"><i class="num">3</i></li>
            </ul>
        </div>
    </section> <!-- // .cert-contents -->
</div> <!-- // .m-initech-certificate-wrap -->
