<meta charset="UTF-8">
<script type="text/javascript">
    $(document).ready(function() {
        // 메세지 공통 처리
        var langtype = sessionStorage.getItem("lang");
        if(langtype === "KOR" || !langtype){
            $('#msg_cert_export_header').text("인증서 내보내기");												// 로그인 
            $('.prev').html('<img src="/SW/initech/webui/res/img/mobile/common/dum_btn_prev.png" alt="인증서 리스트 창 이동" />');
            $("#export_png_id").attr("src","/SW/initech/webui/res/img/mobile/common/dum_cert_export.png");
            $("#INI_refresh_txt").html('<i class="ico refresh"></i> ' + "새로고침");
            $("#msg_noti1").html('<i class="num">1</i>PC에서 인터넷뱅킹에 접속하여 메인 화면의 <em>‘스마트폰 인증서복사  → 기기간 인증서 가져오기’</em> 버튼을 선택하시기 바랍니다.');		//PC에서 신한은행 홈페이지에 접속하여 메인 화면의 <em>‘금융 서비스 → 모바일’ 페이지에서 ‘스마트폰 → PC 인증서 복사’</em> 버튼을 선택하시기 바랍니다.
		    $("#msg_noti2").html('<i class="num">2</i>스마트폰에서 복사할 인증서 암호를 입력 후 PC화면의 인증서 입력란에 <em>인증번호 8자리를 입력</em>하시고 확인 버튼을 선택하시기 바랍니다.');		//PC에 복사할 인증서 암호를 입력 후 위의 <em>인증번호 8자리를 입력</em>하시고 다음 버튼을 선택하시기 바랍니다.
            $("#msg_noti3").html('<i class="num">3</i>PC에서 스마트폰으로 인증서 복사 완료 시 <em>스마트폰 및 PC에서 완료 안내를 확인</em>하시기 바랍니다.');		//스마트폰에서 PC로 인증서 복사 완료 시 <em>스마트폰 및 PC에서 완료 안내를 확인</em>하시기 바랍니다.
            $("#INI_cert_export_title_msg").html("<br>스마트폰에 표시된 인증 번호를 <br>가져오기를 한 기기에 입력 하면 <br>쉽게 인증서를 복사 할 수 있습니다.");
            $('#INI_cert_import_export_spendtime_text').text("남은시간");
        }
        else if(langtype === "ENG"){
            $('#msg_cert_export_header').text("Cert Export");												// 로그인 
            $('.prev').html('<img src="/SW/initech/webui/res/img/mobile/common/dum_btn_prev.png" alt="prev" />');
            $("#export_png_id").attr("src","/SW/initech/webui/res/img/mobile/common/dum_cert_export.png");
            $("#INI_refresh_txt").html('<i class="ico refresh"></i> ' + "refresh");
            $("#msg_noti1").html('<i class="num">1</i>Connect to Internet Banking website on PC and open <em>‘Copy Certificate to a Smart Phone → Import Certificate from a Device’</em> menu on the main screen.');		//PC에서 신한은행 홈페이지에 접속하여 메인 화면의 <em>‘금융 서비스 → 모바일’ 페이지에서 ‘스마트폰 → PC 인증서 복사’</em> 버튼을 선택하시기 바랍니다.
		    $("#msg_noti2").html('<i class="num">2</i>Enter password of the certificate to be copied from smart phone,  <em>nter the 8-digit authentication code</em> on the PC screen, and press OK button.');		//PC에 복사할 인증서 암호를 입력 후 위의 <em>인증번호 8자리를 입력</em>하시고 다음 버튼을 선택하시기 바랍니다.
            $("#msg_noti3").html('<i class="num">3</i>After copying the certificate from PC to smart phone, <em>check the completion message on smart phone and PC</em>.');		//스마트폰에서 PC로 인증서 복사 완료 시 <em>스마트폰 및 PC에서 완료 안내를 확인</em>하시기 바랍니다.
            $("#INI_cert_export_title_msg").html("<br>The certificate can be easily copied <br>by entering authentication code <br>displayed on the smart phone into the selected device.");
            $('#INI_cert_import_export_spendtime_text').text("Time remaining");
        }

     });
        
    </script>

<div class="m-initech-certificate-wrap" id="m-initech-certificate-wrap">        
    <header class="sticky">
        <div class="inner-wrap">
            <h1  id="msg_cert_export_header"></h1>
            <a class="prev"></a>
        </div>
    </header>
    <section class="m-ini-cert-cont">
        <div class="inner-wrap">
            <!-- 인증서 찾기 -->
            <div class="m-ini-cert-manage export">
				<p id="INI_cert_export_title_msg"></p>
                <!--<span class="icon export"><img src="#" id="export_png_id" alt=""></span>-->
				<p>(<span id="INI_cert_import_export_spendtime_text"></span> : <em class="font-color-em1" id="INI_timer" aria-live="polite" aria-hidden="false">00: 00</em>)</p>
                <div class="table">          
                    <span class="input-wrap"><input id="INI_authNum_1" name="INI_authNum" type="number" pattern="[0-9]*" maxlength="4" oninput="INI_maxLengthCheck(this);" onkeydown="return INI_onlyNumber(event)" onkeyup="INI_removeChar(event)" ></span>
                    <span>&nbsp;</span>
                    <span class="input-wrap"><input id="INI_authNum_2" name="INI_authNum" type="number" pattern="[0-9]*" maxlength="4" oninput="INI_maxLengthCheck(this);" onkeydown="return INI_onlyNumber(event)" onkeyup="INI_removeChar(event)" ></span>
                    <span>&nbsp;</span>
                    <span class="input-wrap"><input id="INI_authNum_3" name="INI_authNum" type="number" pattern="[0-9]*" maxlength="4" oninput="INI_maxLengthCheck(this);" onkeydown="return INI_onlyNumber(event)" onkeyup="INI_removeChar(event)" ></span>
                </div>
            </div>
            <!-- // 인증서 찾기 -->
            <!-- 버튼 영역 -->
            <div class="m-ini-mcert-btns">
                <span><a href="#" class="outline" id="INI_refresh_txt"></a></span>
            </div>
            <!-- // 버튼 영역 -->
            <ul class="panel notice">
                <li id="msg_noti1"><i class="num" >1</i></li>
                <li id="msg_noti2"><i class="num">2</i></li>
                <li id="msg_noti3"><i class="num">3</i></li>
            </ul>
        </div>
    </section> <!-- // .cert-contents -->
</div>
