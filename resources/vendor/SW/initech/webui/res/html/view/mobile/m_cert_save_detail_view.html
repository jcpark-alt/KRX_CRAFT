<meta charset="UTF-8">
<script type="text/javascript">
    $(document).ready(function() {
        // 메세지 공통 처리
        var langtype = sessionStorage.getItem("lang");
        if(langtype === "KOR" || !langtype){
            $('#INI_cert_save_detail_view_title').text("인증서 가져오기");
            $('.msg_cert_pw').text("현재 인증서 암호를 입력해 주세요.");
            $('.prev').html('<img src="/SW/initech/webui/res/img/mobile/common/dum_btn_prev.png" alt="이전페이지로 이동" />');
            $('#INI_cert_SaveSubmit').text("확인");
            $('#INI_cert_save_detail_view_cancel').text("취소");
        }
        else if(langtype === "ENG"){
            $('#INI_cert_save_detail_view_title').text("Cert Import");
            $('.msg_cert_pw').text("Enter current password for certificate.");
            $('.prev').html('<img src="/SW/initech/webui/res/img/mobile/common/dum_btn_prev.png" alt="prev" />');
            $('#INI_cert_SaveSubmit').text("Confirm");
            $('#INI_cert_save_detail_view_cancel').text("Cancel");
        }

       
     });
        
    </script>
 <div class="m-initech-certificate-wrap" id="m-initech-certificate-wrap">
     <header class="sticky">
         <div class="inner-wrap">
             <h1 id="INI_cert_save_detail_view_title"></h1>
			<a class="prev" id="INI_PRIV_BTN"></a>
         </div>
     </header>
     <section class="m-ini-cert-cont">
         <div class="inner-wrap">
         	<div class="m-ini-cert-list cert-select" id="INI_cert_single"></div>
             <!-- 인증서 암호입력 -->
             
			<form id="keypadFrm" name="keypadFrm" method="post">
           
             <div class="m-ini-cert-password">
                 <h2 class="sect-title msg_cert_pw"></h2>
                 <div class="input-wrap">
                 	<input type="password" title="password" id="INI_cert_find_userPw" name="INI_cert_find_userPw" autocomplete="off"/>
                	</div>
             </div>
             <!-- // 인증서 암호입력 -->
             <!-- 버튼 영역 -->
             <div class="m-ini-cert-btns">
                 <span id="INI_BACK_BTN"><a href="#" id="INI_cert_save_detail_view_cancel"></a></span>
                 <span>&nbsp;</span>
                 <span><a href="#" class="emp" id="INI_cert_SaveSubmit"></a></span>
             </div>
             <!-- // 버튼 영역 -->
			</form>

         </div>
     </section> <!-- // .cert-contents -->
 </div> <!-- // .m-initech-certificate-wrap -->
<div id="w2ui-popup-uniwebkey"> 
</div>
