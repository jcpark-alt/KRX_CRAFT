name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Node lint + test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  wsxml-lint:
    name: WebSquare XML lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install wsxml_lint
        run: pip install "./tools/wsxml_lint[test]"

      - name: Unit tests
        run: pytest
        working-directory: tools/wsxml_lint

      - name: Lint gcc common library (strict)
        run: python -m wsxml_lint src/gcc

      - name: Lint legacy modules (ignore W-Craft conversion-gap rules)
        # src/as-is/ins, src/as-is/mgt, src/as-is/stf are W-Craft-converted pages that
        # systematically lack head metadata (WS111) / <w2:layoutInfo> (WS112) /
        # <w2:dataCollection> (WS113). These are an accepted baseline; ignore
        # them so real errors surface. See CLAUDE.md "Toolchain & commands".
        run: python -m wsxml_lint src/as-is/ins src/as-is/mgt src/as-is/stf --ignore WS111,WS112,WS113
