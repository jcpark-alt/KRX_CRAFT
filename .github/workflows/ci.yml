name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: Node lint + test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  wsxml-lint:
    name: WebSquare XML lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install wsxml_lint
        run: pip install "./tools/wsxml_lint[test]"

      - name: Unit tests
        run: pytest
        working-directory: tools/wsxml_lint

      - name: Lint WebSquare XML pages
        run: python -m wsxml_lint gcc ins mgt stf
