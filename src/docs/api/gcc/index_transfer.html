  { asis:"$c.{객체명}.alert_error", tobe:"$c.win.alert  또는  $c.win.messageBox($p, \"alert\", \"{보낼 메시지}\", {callbackFunction});", note:"단순 알림은 $c.win.alert, 콜백이 필요하면 $c.win.messageBox 사용" },
  { asis:"$c.{객체명}.getObjectValue({컴포넌트})", tobe:"{컴포넌트}.getValue();", note:"" },
  { asis:"$c.{객체명}.setObjectValue({컴포넌트}, value)", tobe:"{컴포넌트}.setValue(value);", note:"" },
];

function renderRules() {
  let html = '<section class="rules-group"><h2>공통 변환 규칙 (직접 치환 패턴)</h2>'
    + '<p class="rules-sub">파일과 무관하게 적용되는 객체/컴포넌트 단위 치환 규칙. '
    + '<code>{객체명}</code>·<code>{컴포넌트}</code>·<code>value</code> 는 실제 식별자로 대체.</p>';
  CONV_RULES.forEach((r, i) => {
    const note = r.note ? '<p class="note">' + esc(r.note) + '</p>' : '';
    html += '<article class="rule-card" id="rule-' + (i + 1) + '">'
          + '<div class="rule-pat"><span class="rule-no">' + (i + 1) + '</span>'
          + '<code class="asis">' + esc(r.asis) + '</code>'
          + '<span class="arrow">→</span>'
          + '<code class="tobe">' + esc(r.tobe) + '</code></div>'
          + note
          + '</article>';
  });
  html += '</section>';
  document.getElementById("rules").innerHTML = html;
}

// 중복제거: 동일 (file, asis, tobe, desc, tag) 행은 하나로 합침.
const DATA = (function dedupe() {
  const seen = new Set(), out = [];
  RAW.forEach(r => {
    const key = [r.file, r.asis, r.tobe, r.desc, r.tag || ""].join("|");
    if (seen.has(key)) return;
    seen.add(key);
    out.push(r);
  });
  return out;
})();

// $c.<ns>.<fn> → gcc/index.html 앵커(m-<ns>-<fn>, 와일드카드는 모듈 섹션 mod-<ns>)
function toAnchor(tobe) {
  const m = tobe.match(/\$c\.([a-z]+)\.([A-Za-z0-9_*]+)/);
  if (!m) return null;
  return (m[2] === "*") ? ("mod-" + m[1]) : ("m-" + m[1] + "-" + m[2]);
}
function esc(s) { return (s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function tobeLink(tobe) {
  const anchor = toAnchor(tobe);
  const href = GCC_INDEX + (anchor ? "#" + anchor : "");
  return '<a class="tobe" href="' + href + '" target="_blank" rel="noopener" title="gcc/index.html 에서 보기">'
       + esc(tobe) + '<span class="ext">↗</span></a>';
}

function render() {
  const files = [];
  DATA.forEach(d => { if (files.indexOf(d.file) === -1) files.push(d.file); });

  document.getElementById("summary").textContent =
    "참조: fil/ins/mgt_function_analysis_report.md · 공통이관 대표 " + DATA.length + "건 · 연동 타겟: gcc/index.html";
  document.getElementById("sub").textContent = DATA.length + "건 · " + files.length + "개 원본 파일";

  // sidebar
  let nav = "";
  files.forEach(f => {
    nav += '<div class="nav-file">' + esc(f) + '</div>';
    DATA.forEach((d, i) => {
      if (d.file === f) nav += '<a href="#card-' + i + '">' + esc(d.asis) + '</a>';
    });
  });
  document.getElementById("nav").innerHTML = nav;

  // main cards grouped by file
  let main = "";
  files.forEach(f => {
    main += '<section class="file-group"><h2>' + esc(f) + '</h2>';
    DATA.forEach((d, i) => {
      if (d.file !== f) return;
      const tag = d.tag
        ? ' <span class="badge ' + (d.tag === "대체" ? "replace" : "review") + '">' + esc(d.tag) + '</span>'
        : "";
      const search = esc((d.asis + " " + d.tobe + " " + d.desc).toLowerCase());
      main += '<article class="card" id="card-' + i + '" data-search="' + search + '">'
            + '<div class="map-row"><code class="asis">' + esc(d.asis) + '</code>'
            + '<span class="arrow">→</span>' + tobeLink(d.tobe) + tag + '</div>'
            + '<p class="desc">' + esc(d.desc) + '</p>'
            + '</article>';
    });
    main += '</section>';
  });
  document.getElementById("main").innerHTML = main;
}
renderRules();
render();

// 검색 필터 (AS-IS / TO-BE / 설명)
const box = document.getElementById("search");
box.addEventListener("input", () => {
  const v = box.value.trim().toLowerCase();
  document.querySelectorAll(".card").forEach(c => {
    c.style.display = (!v || c.dataset.search.indexOf(v) !== -1) ? "" : "none";
  });
  document.querySelectorAll(".file-group").forEach(g => {
    const any = [...g.querySelectorAll(".card")].some(c => c.style.display !== "none");
    g.style.display = (!v || any) ? "" : "none";
  });
});
