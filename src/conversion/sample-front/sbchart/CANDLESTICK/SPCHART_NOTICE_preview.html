<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SPCHART_NOTICE 미리보기 — 공시그래프 (캔들+거래량+공시목록)</title>
<!--
  SPCHART_NOTICE.xml 의 브라우저 미리보기 하네스 (WebSquare 런타임 없이 차트 동작 확인용).
  - 실제 sbchart.js/sbchart.css 를 로드하고, $c.ext.drawChartData 의 조립 방식(config.data = {type, json, keys...})을
    그대로 재현한다. WebSquare 전용 부분($c.sbm 조회 → 인라인 데이터, w2:gridView → HTML 표)만 대체.
  - 데이터는 data/chart_data.json 을 fetch 로 조회한다(응답 형식 { body: { chartList, disclsList } } — XML 원본과 동일 소스).
    ※ 로컬 HTTP 서버(Live Server 등)에서 열 것 — file:// 직접 열기는 fetch 가 CORS 로 차단됨(안내 표시).
  - 이 파일은 미리보기 전용이며 배포 대상이 아니다. 화면 로직의 원본은 SPCHART_NOTICE.xml.
-->
<link rel="stylesheet" href="../sbchart.css">
<script src="../license.js"></script>
<script src="../sbchart.js"></script>
<style>
  body { margin: 0; font-family: "Malgun Gothic", sans-serif; background: #eef1f5; }
  .win { max-width: 920px; margin: 16px auto; background: #fff; border: 1px solid #b8c4d0; }
  .titlebar { background: linear-gradient(#4a6fa5, #33517e); color: #fff; padding: 6px 10px; font-size: 13px; font-weight: bold; }
  .wrap { padding: 12px; }
  .desc { padding: 8px 12px; margin-bottom: 8px; background: #eef6f3; border-left: 4px solid #0a8060; border-radius: 4px; font-size: 12px; color: #555; }
  .desc b { display: block; color: #0a7a52; font-size: 13px; }
  #chartTop { width: 100%; height: 340px; }
  #chartVol { width: 100%; height: 150px; margin-top: 4px; }
  table.discls { border-collapse: collapse; width: 100%; margin-top: 10px; font-size: 12px; }
  table.discls th { background: #f2f5f9; border: 1px solid #d7dee7; padding: 6px 8px; }
  table.discls td { border: 1px solid #e3e8ef; padding: 6px 8px; }
  table.discls td.c { text-align: center; }
  table.discls tr:hover td { background: #eaf1fd; }
  #status { display: none; margin: 8px 0; padding: 10px 14px; background: #fdf3e3; border-left: 4px solid #b45309; font-size: 13px; color: #7c4a02; }
</style>
</head>
<body>
<div class="win">
  <div class="titlebar">SPCHART_NOTICE 미리보기 — 공시그래프</div>
  <div class="wrap">
    <div class="desc">
      <b>공시그래프 (candlestick + volume + 공시목록)</b>
      상단 캔들·하단 거래량에 십자선과 커스텀 툴팁(날짜/시가/종가/고가/저가/거래량)을 적용하고,
      공시일 캔들 하단에 초록 마커, 최고가·최저가에 gray 수치·삼각형 마커를 표시하며, 최하단 표에 공시목록을 연동합니다.
    </div>
    <div id="status"></div>
    <div id="chartTop"></div>
    <div id="chartVol"></div>
    <table class="discls">
      <thead><tr><th>공시제목</th><th style="width:170px;">공시시간</th><th style="width:110px;">공시유형</th></tr></thead>
      <tbody id="disclsBody"></tbody>
    </table>
  </div>
</div>

<script>
///////// 1. 변수 및 선언 영역 /////////

// ---- 데이터 : data/chart_data.json 을 fetch 로 조회 (XML 원본과 동일 소스·형식 { body: { chartList, disclsList } }) ----
const CHART_DATA_URL = "data/chart_data.json";

// ---- WebSquare 스텁 ($c.num.formatNumber · $c.date.formatDateTime 만 필요) ----
const $c = {
    num: { formatNumber: function (v) {
        if (v == null || v === "" || isNaN(v)) { return v == null ? "" : String(v); }
        return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    } },
    // gcc $c.date.formatDateTime 대응 스텁 — 이 화면에서 쓰는 yyyyMMdd 문자열 입력 케이스만 재현
    date: { formatDateTime: function (value, sDateFormat) {
        const s = value == null ? "" : String(value);
        if (!s) { return ""; }
        const fmt = sDateFormat || "yyyyMMdd";
        return fmt.replace(/yyyy/g, s.slice(0, 4)).replace(/MM/g, s.slice(4, 6)).replace(/dd/g, s.slice(6, 8));
    } }
};

// ==== 이하 로직은 SPCHART_NOTICE.xml 의 CDATA 와 동일 (scwin → 전역, drawChartData → 로컬 재현) ====

const CHART_Y_WIDTH    = 78;
const CHART_UP_COLOR   = "#E52528";
const CHART_DOWN_COLOR = "#1B64DA";
const NOTICE_COLOR     = "#2AC1BC";   // 민트
const HIGHLOW_COLOR    = "#637381";   // 최고/최저가 수치·삼각형 마커 색상 (회색)
let TOOLTIP_TRIGGER  = "shape";   // ★ 툴팁 표시 방식 — "shape": 도형(캔들/막대) 위에서만(기본) | "band": 플롯 어디서나 해당 날짜 표시

let DATES = [];
let ROWS  = [];
const HIT = {};   // TOOLTIP_TRIGGER="shape" 용 hit-test 상태 (차트별 도형 bbox + 마지막 마우스 플롯 좌표)
const CHARTS = {};   // 컨테이너 id → 차트 인스턴스 — 재렌더 시 destroy 로 라이브러리 전역 resize 리스너 해제 (고아 리스너의 null.style 오류 방지)


///////// 2. 초기화 영역 /////////

// 진입점 (XML 의 scwin.onpageload 대응) — 데이터 조회 → 공시목록·차트 렌더 → 상호작용 초기화
window.onload = function () {
    if (!(window.sb && sb.chart && typeof sb.chart.render === "function")) {
        showStatus("sbchart 라이브러리가 로드되지 않았습니다. ../sbchart.js 경로와 의존 스크립트(d3 등) 로드 여부를 확인하세요. "
                 + "(콘솔 오류 참고 — d3 가 외부 의존이면 sbchart.js 앞에 d3 스크립트를 추가)");
        return;
    }
    loadData().then(function (body) {
        renderDisclsTable(body.disclsList);

        const data = buildChartData(body.chartList, body.disclsList);
        ROWS = data;
        DATES = data.map(function (r) { return r.date; });
        render(data);
        syncCrosshair("chartTop", "chartVol", data);   // 상/하 차트 crosshair 세로선 동기화
        setupCrosshairXLabel("chartTop", "chartVol");  // 상단 세로선(네이티브/미러) 하단 날짜 라벨

        // 리사이즈 대응 — 라이브러리가 리사이즈 시 svg 를 재생성해 커스텀 오버레이가 사라지고
        // hit-test 좌표 캐시가 구좌표로 남는다(헤드리스 실측). 재렌더는 라이브러리에 맡기고,
        // 라이브러리 재렌더가 끝난 뒤(디바운스) 오버레이·hit-test·동기화만 재적용한다.
        let resizeTimer = null;
        window.addEventListener("resize", function () {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function () {
                if (!ROWS.length) { return; }
                drawNoticeArrows("chartTop", ROWS);      // 공시일 ▲ 재적용
                drawHighLowMarkers("chartTop", ROWS);    // 최고/최저가 마커 재적용
                syncCrosshair("chartTop", "chartVol", ROWS);    // 미러선·hit-test 재구축 (새 svg 기준)
                setupCrosshairXLabel("chartTop", "chartVol");   // 날짜 라벨 재부착
            }, 250);
        });
        if (data.length < 10) {
            showStatus("참고: 현재 chart_data.json 의 chartList 는 유효 행 " + data.length + "건이라 캔들이 성깁니다. "
                     + "참고 이미지 수준의 밀도를 보려면 chartList 데이터 보강이 필요합니다.");
        }
    }).catch(function (ex) {
        showStatus("데이터 조회/렌더 중 오류: " + (ex && ex.message ? ex.message : ex)
                 + " — file:// 로 직접 열면 fetch 가 차단되니 로컬 HTTP 서버에서 여세요.");
        if (window.console) { console.error(ex); }
    });
};


///////// 3. 컴포넌트 이벤트 영역 /////////

// (해당 없음 — 차트 상호작용은 렌더 후 SVG/DOM 리스너로 등록 : syncCrosshair·setupShapeHit·setupCrosshairXLabel)


///////// 4. 서브미션 콜백 영역 /////////

// XML 의 $c.sbm.executeDynamic 대체 — fetch 로 차트 데이터 조회
function loadData() {
    return fetch(CHART_DATA_URL).then(function (res) {
        if (!res.ok) { throw new Error("HTTP " + res.status + " — " + CHART_DATA_URL); }
        return res.json();
    }).then(function (json) {
        return (json && json.body) ? json.body : { chartList: [], disclsList: [] };
    });
}


///////// 5. 일반/업무 함수 영역 /////////

function buildChartData(chartList, disclsList) {
    const noticeDates = {};
    (disclsList || []).forEach(function (d) { noticeDates[d.trdDd] = true; });
    return (chartList || []).filter(function (r) {
        return !(Number(r.open) === 0 && Number(r.high) === 0 && Number(r.low) === 0);
    }).map(function (r) {
        return {
            date: r.date, open: Number(r.open), close: Number(r.close),
            low: Number(r.low), high: Number(r.high), admnt: Number(r.admnt),
            // 공시일 여부 — 렌더 후 ▲ 오버레이 대상 (combo scatter 는 라이브러리가 null 값을
            // 객체로 오인해 크래시하므로 사용하지 않는다. post-render SVG 방식으로 대체)
            isNotice: (r.gongsi === true || r.gongsi === "true" || r.gongsi === "Y" || noticeDates[r.date] === true)
        };
    });
}

/**
 * 시리즈 도형 목록 추출 (헤드리스 DOM 실측 기반 — 클래스 셀렉터).
 *  - 캔들 차트 : 캔들 1개 = <g class="sbchart-bar sbchart-shape sbchart-shape-N"> (wick path + body rect)
 *  - 막대 차트 : <g class="sbchart-shapes ..."> 하위 rect (막대 1개 = rect 1개)
 */
function seriesShapes(svg, dataLen) {
    let candles = svg.querySelectorAll("g.sbchart-shape");
    const list = candles.length ? candles : svg.querySelectorAll("g.sbchart-shapes > rect");
    return (list.length === dataLen) ? Array.prototype.slice.call(list) : null;
}

function drawNoticeArrows(chartElId, data, tryCnt) {
    let svg = document.querySelector("#" + chartElId + " svg");
    let candles = svg ? seriesShapes(svg, data.length) : null;
    if (!candles) {   // 렌더 지연 방어 — 최대 10회 재시도
        if ((tryCnt || 0) < 10) { setTimeout(function () { drawNoticeArrows(chartElId, data, (tryCnt || 0) + 1); }, 100); }
        return;
    }
    svg.querySelectorAll("path.notice-arrow").forEach(function (el) { el.remove(); });   // 재적용(리사이즈) 대비 정리
    data.forEach(function (r, i) {
        if (!r.isNotice) { return; }
        let b = candles[i].getBBox();
        const cx = b.x + b.width / 2;
        const top = b.y + b.height + 6;   // 캔들(저가) 바로 아래
        let p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        // 꼭짓점 위 + 하단이 오목한 다트형 화살표 (아래 변을 Q 곡선으로 위로 파냄)
        p.setAttribute("d", "M " + cx + " " + top
                          + " L " + (cx + 6) + " " + (top + 11)
                          + " Q " + cx + " " + (top + 5) + " " + (cx - 6) + " " + (top + 11)
                          + " Z");
        p.setAttribute("class", "notice-arrow");
        p.setAttribute("fill", NOTICE_COLOR);
        p.setAttribute("pointer-events", "none");   // 차트 마우스 이벤트 방해 금지
        candles[i].parentNode.appendChild(p);   // 같은 좌표계(부모 그룹)에 추가
    });
}

/**
 * 최고가/최저가 마커 표시 (렌더 후 SVG 오버레이 — 참고 이미지 재현).
 *  - 최고가 캔들 위 : 수치 + 바로 아래 ▼(역삼각형)
 *  - 최저가 캔들 아래 : ▲(삼각형) + 바로 아래 수치
 *  - 색상은 HIGHLOW_COLOR(회색 #637381). 시리즈 그룹은 clip-path 로 잘릴 수 있어
 *    svg 루트에 추가한다(그룹 좌표 → getCTM 으로 루트 좌표 변환).
 */
function drawHighLowMarkers(chartElId, data, tryCnt) {
    const svg = document.querySelector("#" + chartElId + " svg");
    const candles = svg ? seriesShapes(svg, data.length) : null;
    if (!candles) {   // 렌더 지연 방어 — 최대 10회 재시도
        if ((tryCnt || 0) < 10) { setTimeout(function () { drawHighLowMarkers(chartElId, data, (tryCnt || 0) + 1); }, 100); }
        return;
    }
    let hiIdx = 0, loIdx = 0;
    data.forEach(function (r, i) {
        if (r.high > data[hiIdx].high) { hiIdx = i; }
        if (r.low  < data[loIdx].low)  { loIdx = i; }
    });
    const oldLayer = svg.querySelector("g.notice-highlow");
    if (oldLayer) { oldLayer.remove(); }   // 재적용(리사이즈) 대비 정리
    const group = candles[0].parentNode;
    function toRoot(x, y) {   // 시리즈 그룹 좌표 → svg 루트 좌표
        const pt = svg.createSVGPoint();
        pt.x = x; pt.y = y;
        return pt.matrixTransform(group.getCTM());
    }
    const layer = document.createElementNS("http://www.w3.org/2000/svg", "g");
    layer.setAttribute("class", "notice-highlow");
    layer.setAttribute("pointer-events", "none");   // 차트 마우스 이벤트 방해 금지
    svg.appendChild(layer);

    function put(idx, value, isHigh) {
        const b = candles[idx].getBBox();
        const cx = b.x + b.width / 2;
        // 최저가 캔들이 공시일이면 민트 화살표(저가 +6~+17)와 겹치지 않게 아래로 내림
        const gap = (!isHigh && data[idx].isNotice) ? 13 : 0;
        const ay = isHigh ? b.y - 4 : b.y + b.height + 4 + gap;   // 삼각형 꼭짓점 y (캔들 쪽)
        const by = isHigh ? ay - 7 : ay + 7;                      // 삼각형 밑변 y
        const apex = toRoot(cx, ay), bl = toRoot(cx - 4, by), br = toRoot(cx + 4, by);
        const tri = document.createElementNS("http://www.w3.org/2000/svg", "path");
        tri.setAttribute("d", "M " + apex.x + " " + apex.y + " L " + bl.x + " " + bl.y + " L " + br.x + " " + br.y + " Z");
        tri.setAttribute("fill", HIGHLOW_COLOR);
        layer.appendChild(tri);
        const tp = toRoot(cx, isHigh ? by - 3 : by + 12);   // 수치 기준선 — 삼각형 밑변 위/아래
        const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
        txt.setAttribute("x", tp.x);
        txt.setAttribute("y", tp.y);
        txt.setAttribute("text-anchor", "middle");
        txt.setAttribute("fill", HIGHLOW_COLOR);
        txt.setAttribute("font-size", "11");
        txt.textContent = $c.num.formatNumber(value);
        layer.appendChild(txt);
    }
    put(hiIdx, data[hiIdx].high, true);    // 최고가 : 수치 + 바로 아래 ▼
    put(loIdx, data[loIdx].low,  false);   // 최저가 : ▲ + 바로 아래 수치
}

function setupShapeHit(key, svg, shapes) {
    const group = shapes[0].parentNode;
    const MIN_HIT_H = 10;   // 최소 hit 높이 — 저거래량 막대(~1px)는 hover 판정이 불가능해 밑변 고정·위로 확장
    let st = HIT[key] = {
        boxes: shapes.map(function (s) {
            const b = s.getBBox();
            let y = b.y, h = b.height;
            if (h < MIN_HIT_H) { y = y + h - MIN_HIT_H; h = MIN_HIT_H; }   // 밑변(축) 고정, 위로 확장
            return { x: b.x, y: y, w: b.width, h: h };
        }),
        last: null
    };
    // capture 단계 등록 — 라이브러리 핸들러(툴팁 갱신)보다 먼저 좌표를 기록
    svg.addEventListener("mousemove", function (e) {
        let pt = svg.createSVGPoint();
        pt.x = e.clientX; pt.y = e.clientY;
        const loc = pt.matrixTransform(group.getScreenCTM().inverse());
        st.last = { x: loc.x, y: loc.y };
    }, true);
    svg.addEventListener("mouseleave", function () { st.last = null; }, true);
}

function isOverShape(key, i) {
    let st = HIT[key];
    if (!st || !st.last || !st.boxes[i]) { return false; }
    let b = st.boxes[i], t = 3;   // 허용 오차(px)
    return st.last.x >= b.x - t && st.last.x <= b.x + b.w + t
        && st.last.y >= b.y - t && st.last.y <= b.y + b.h + t;
}

function noticeTooltip(d) {
    let p = (d && d.length) ? d[0] : d;
    let i = (p && p.index != null) ? p.index : ((p && p.x != null) ? p.x : -1);
    if (TOOLTIP_TRIGGER === "shape" && !isOverShape("top", i)) { return ""; }   // 도형 밖 — 숨김(:empty 규칙)
    let row = ROWS[i];
    if (!row) { return ""; }
    const fmt = $c.num.formatNumber;
    return "<div style='background:#fff;border:1px solid #e74c3c;padding:6px 10px;font-size:12px;color:#c0392b;line-height:1.6;'>"
         + "날짜 : " + $c.date.formatDateTime(row.date, "yyyy-MM-dd") + "<br/>"
         + "시가 : " + fmt(row.open)  + "<br/>"
         + "종가 : " + fmt(row.close) + "<br/>"
         + "고가 : " + fmt(row.high)  + "<br/>"
         + "저가 : " + fmt(row.low)   + "<br/>"
         + "거래량 : " + fmt(row.admnt)
         + "</div>";
}

// $c.ext.drawChartData 재현 : dataBlock = {type, json, keys, (dataOpts…)} → config.data 결합 → sb.chart.render
// 이전 인스턴스는 destroy 후 재렌더 — 전역 resize 리스너 잔존(고아 리스너) 방지 (ext.xml 과 동일)
function drawChartData(type, rows, elId, config) {
    let dataBlock = { type: type, json: rows };
    const opts = {};
    for (let k in config) { if (config.hasOwnProperty(k) && k !== "keys" && k !== "dataOpts") { opts[k] = config[k]; } }
    if (config.keys) { dataBlock.keys = config.keys; }
    if (config.dataOpts) { for (let dk in config.dataOpts) { if (config.dataOpts.hasOwnProperty(dk)) { dataBlock[dk] = config.dataOpts[dk]; } } }
    if (CHARTS[elId]) {
        // 캡처해 둔 resize 리스너 직접 제거 — 라이브러리 destroy() 는 이를 해제하지 않음(실측)
        (CHARTS[elId].resizeFns || []).forEach(function (fn) { window.removeEventListener("resize", fn); });
        try { CHARTS[elId].inst.destroy(); } catch (ignore) { /* 이미 제거된 DOM 등 — 무시 */ }
        delete CHARTS[elId];
    }
    const el = document.getElementById(elId);
    if (el) { el.innerHTML = ""; }
    opts.data = dataBlock;
    // render 중 등록되는 window resize 리스너 캡처 (동기 등록 실측 확인)
    const captured = [];
    const origAdd = window.addEventListener;
    window.addEventListener = function (type, fn) {
        if (type === "resize") { captured.push(fn); }
        return origAdd.apply(window, arguments);
    };
    let inst;
    try {
        inst = sb.chart.render("#" + elId, opts);
    } finally {
        window.addEventListener = origAdd;   // 어떤 경우에도 원복
    }
    CHARTS[elId] = { inst: inst, resizeFns: captured };
}

function render(data) {
    drawChartData("candlestick", data, "chartTop", {
        legend: { show: false },
        global: { crosshair: { show: true } },
        tooltip: { custom: noticeTooltip },
        axis: {
            y: { width: CHART_Y_WIDTH },
            x: { tick: { format: function (v) {
                const d = DATES[v];
                return (d && v % 2 === 0) ? d.slice(4, 6) + "-" + d.slice(6) : "";
            } } }
        },
        extend: {
            candlestick: { auto: true, inColor: CHART_UP_COLOR, deColor: CHART_DOWN_COLOR, marker: { show: false } }
        },
        dataOpts: {
            keys: { x: "date", value: [ { open: "open", close: "close", low: "low", high: "high" } ] }
        }
    });
    drawNoticeArrows("chartTop", data);     // 공시일 ▲ 오버레이 (렌더 후)
    drawHighLowMarkers("chartTop", data);   // 최고/최저가 수치·삼각형 마커 (gray)

    drawChartData("bar", data, "chartVol", {
        legend: { show: false },
        global: { crosshair: { show: true } },
        tooltip: { custom: volumeTooltip },   // "라벨 : 값" 형식 (날짜/거래량) — 상단과 통일
        axis: {
            y: { width: CHART_Y_WIDTH, tick: { format: function (v) { return $c.num.formatNumber(v); } } },
            x: { tick: { format: function () { return ""; } } }
        },
        extend: { bar: { width: { ratio: 0.5 } } },
        dataOpts: { keys: { x: "date", value: [ "admnt" ] } }
    });
}

/**
 * 상/하 차트 crosshair 세로선 동기화 (좌표 기반 미러링).
 * 마우스가 있는 차트에서 가장 가까운 캔들/막대의 중심 x 를 찾아, "반대편 차트"의
 * 같은 인덱스 위치에 세로선을 직접 그린다 — 라이브러리 내부 이벤트 구조에 의존하지 않아
 * 확실하게 동작한다(마우스가 있는 차트 자체는 네이티브 crosshair 가 표시).
 * 좌표는 시리즈 그룹(getScreenCTM 역변환) 기준이라 두 차트의 마진 차이와 무관.
 */
function syncCrosshair(idA, idB, data, tryCnt) {
    function seriesInfo(id) {
        let svg = document.querySelector("#" + id + " svg");
        if (!svg) { return null; }
        const shapes = seriesShapes(svg, data.length);
        if (!shapes) { return null; }
        let centers = [], bottom = 0;
        for (let si = 0; si < shapes.length; si++) {
            let b = shapes[si].getBBox();
            centers.push(b.x + b.width / 2);
            if (b.y + b.height > bottom) { bottom = b.y + b.height; }
        }
        return { svg: svg, group: shapes[0].parentNode, shapes: shapes, centers: centers, bottom: bottom };
    }
    let A = seriesInfo(idA), B = seriesInfo(idB);
    if (!A || !B) {   // 렌더 지연 방어
        if ((tryCnt || 0) < 10) { setTimeout(function () { syncCrosshair(idA, idB, data, (tryCnt || 0) + 1); }, 100); }
        return;
    }
    // 플롯 바닥(x축 위치)을 시리즈 그룹 좌표로 환산 — 도형 최하단(info.bottom)은 캔들 차트에서
    // 최저가 위치까지만이라 세로선이 축까지 닿지 않는다. x축 실좌표 기준이 정확하다.
    function plotBottom(info) {
        const axis = info.svg.querySelector(".sbchart-axis-x");
        if (axis) {
            const ab = axis.getBoundingClientRect();
            const pt = info.svg.createSVGPoint();
            pt.x = ab.left; pt.y = ab.top;
            return pt.matrixTransform(info.group.getScreenCTM().inverse()).y;
        }
        return info.bottom;   // 축 미탐색 시 폴백
    }

    function makeLine(info) {
        const prev = info.svg.querySelector(".notice-mirror-line");
        if (prev) { prev.remove(); }   // 재적용(리사이즈) 대비 정리
        const ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
        ln.setAttribute("class", "notice-mirror-line");   // 하단 hover 시 날짜 라벨 기준선으로도 사용
        ln.setAttribute("y1", 0);
        ln.setAttribute("y2", plotBottom(info));
        ln.setAttribute("stroke", "#C0C0C0");          // 네이티브 crosshair(.sbchart-crosshair-x)와 동일 스타일
        ln.setAttribute("stroke-dasharray", "3,3");    // 점선 3,3
        ln.setAttribute("stroke-width", "1");
        ln.setAttribute("visibility", "hidden");
        ln.setAttribute("pointer-events", "none");
        info.group.appendChild(ln);   // 시리즈 그룹에 추가해 transform 승계
        return ln;
    }
    let lineA = makeLine(A), lineB = makeLine(B);   // 각 차트의 미러 세로선

    // shape 모드 hit-test 준비 + 빈 툴팁 잔상 제거(:empty — width/box-shadow 기본값 때문에 필요)
    setupShapeHit("top", A.svg, A.shapes);
    setupShapeHit("vol", B.svg, B.shapes);
    if (!document.getElementById("notice-tooltip-empty-fix")) {   // 재적용(리사이즈) 시 중복 방지
        const styleEl = document.createElement("style");
        styleEl.id = "notice-tooltip-empty-fix";
        styleEl.textContent = "#" + idA + " .sbchart-tooltip:empty, #" + idB + " .sbchart-tooltip:empty { display: none !important; }";
        document.head.appendChild(styleEl);
    }

    function mouseToPlotX(src, e) {
        // 마우스 clientX → 시리즈 그룹 좌표계 x (마진/transform 자동 반영)
        let pt = src.svg.createSVGPoint();
        pt.x = e.clientX; pt.y = e.clientY;
        return pt.matrixTransform(src.group.getScreenCTM().inverse()).x;
    }

    // 마우스가 있는 차트는 네이티브 crosshair+자기 툴팁, 반대편 차트에는 점선 미러(연속 추적)
    function wireMirror(src, dstLine) {
        const step = src.centers.length > 1 ? (src.centers[src.centers.length - 1] - src.centers[0]) / (src.centers.length - 1) : 0;
        const minX = src.centers[0] - step / 2;
        const maxX = src.centers[src.centers.length - 1] + step / 2;
        src.svg.addEventListener("mousemove", function (e) {
            const x = Math.max(minX, Math.min(maxX, mouseToPlotX(src, e)));
            dstLine.setAttribute("x1", x);
            dstLine.setAttribute("x2", x);
            dstLine.setAttribute("visibility", "visible");
        });
        src.svg.addEventListener("mouseleave", function () {
            dstLine.setAttribute("visibility", "hidden");
        });
    }
    wireMirror(A, lineB);   // 상단 hover → 하단에 점선
    wireMirror(B, lineA);   // 하단 hover → 상단에 점선
}

/**
 * 하단 거래량 커스텀 툴팁 — 상단과 동일한 "라벨 : 값" 형식 (날짜/거래량)
 */
function volumeTooltip(d) {
    let p = (d && d.length) ? d[0] : d;
    let i = (p && p.index != null) ? p.index : ((p && p.x != null) ? p.x : -1);
    if (TOOLTIP_TRIGGER === "shape" && !isOverShape("vol", i)) { return ""; }   // 도형 밖 — 숨김(:empty 규칙)
    let row = ROWS[i];
    if (!row) { return ""; }
    // 네이티브 툴팁(.sbchart-tooltip) 색상 — 배경 rgba(0,0,0,.7)·글자 #fff
    return "<div style='background:rgba(0,0,0,.7);border-radius:5px;padding:6px 10px;font-size:12px;color:#fff;line-height:1.6;'>"
         + "날짜 : " + $c.date.formatDateTime(row.date, "yyyy-MM-dd") + "<br/>"
         + "거래량 : " + $c.num.formatNumber(row.admnt)
         + "</div>";
}

/**
 * 상단 crosshair 세로선 하단에 x값(날짜) 라벨 표시.
 * 라이브러리는 이 구성에서 y값 라벨(.sbchart-crosshair-yvalue)만 그리므로,
 * 동일 스타일(배경 #C0C0C0·흰 글자 10px)의 라벨을 세로선(.sbchart-crosshair-x)의
 * 실제 위치에 맞춰 HTML 오버레이(절대배치 div)로 그린다.
 * ※ svg 내부 추가 방식은 라이브러리의 svg 재구성과 충돌해 페인트가 차단되는 것을
 *   헤드리스 실측으로 확인 — 컨테이너 위 HTML 오버레이가 확실하다.
 */
function setupCrosshairXLabel(id, volId, tryCnt) {
    const box = document.getElementById(id);
    const svg = box ? box.querySelector("svg") : null;
    const volSvg = document.querySelector("#" + volId + " svg");
    if (!svg || !volSvg) {
        if ((tryCnt || 0) < 10) { setTimeout(function () { setupCrosshairXLabel(id, volId, (tryCnt || 0) + 1); }, 100); }
        return;
    }
    if (getComputedStyle(box).position === "static") { box.style.position = "relative"; }   // 오버레이 기준 좌표

    const prevLbl = box.querySelector(".notice-crosshair-xvalue");
    if (prevLbl) { prevLbl.remove(); }   // 재적용(리사이즈) 대비 정리
    const lbl = document.createElement("div");
    lbl.className = "notice-crosshair-xvalue";
    lbl.style.cssText = "position:absolute;display:none;background:#C0C0C0;color:#fff;font-size:10px;"
        + "line-height:14px;height:14px;min-width:38px;text-align:center;border-radius:2px;"
        + "pointer-events:none;z-index:10;";
    box.appendChild(lbl);

    // 기준 세로선(네이티브 crosshair 또는 미러선)의 위치로 라벨 갱신 — 두 선 모두 동일 그룹 좌표계
    function updateFromLine(xline) {
        if (!xline) { return; }

        // 세로선의 화면 좌표(하단점) → 컨테이너 상대 좌표
        const lb = xline.getBoundingClientRect();
        const cb = box.getBoundingClientRect();
        const x = lb.left - cb.left;
        const bottom = lb.bottom - cb.top;

        // 세로선(그룹 좌표 x1)과 가장 가까운 캔들 인덱스 → 날짜 (x축 tick 과 동일한 MM-DD 표기)
        const lineX = parseFloat(xline.getAttribute("x1"));
        let best = 0, bd = Infinity;
        const boxes = (HIT.top && HIT.top.boxes) || [];
        for (let i = 0; i < boxes.length; i++) {
            const c = boxes[i].x + boxes[i].w / 2;
            const d = Math.abs(c - lineX);
            if (d < bd) { bd = d; best = i; }
        }
        const dt = DATES[best];
        lbl.textContent = dt ? dt.slice(4, 6) + "-" + dt.slice(6) : "";

        lbl.style.left = Math.round(x - 19) + "px";
        lbl.style.top = Math.round(bottom + 2) + "px";
        lbl.style.display = "block";
    }

    // 상단 hover — 네이티브 crosshair 세로선 기준
    svg.addEventListener("mousemove", function () {
        updateFromLine(svg.querySelector(".sbchart-crosshair-x"));
    }, true);
    svg.addEventListener("mouseleave", function () { lbl.style.display = "none"; }, true);

    // 하단 hover — 상단 미러 세로선 기준 (bubble 단계 등록: syncCrosshair 가 미러선 위치를
    // 갱신한 뒤 실행되도록 — 등록 순서상 wireMirror 리스너 다음)
    volSvg.addEventListener("mousemove", function () {
        const mirror = svg.querySelector(".notice-mirror-line");
        if (mirror && mirror.getAttribute("visibility") === "visible") { updateFromLine(mirror); }
    });
    volSvg.addEventListener("mouseleave", function () { lbl.style.display = "none"; });
}

function renderDisclsTable(list) {
    const tb = document.getElementById("disclsBody");
    tb.innerHTML = (list || []).map(function (r) {
        return "<tr><td>" + r.disclsTitle + "</td><td class='c'>" + r.disclsPublDdtm + "</td><td class='c'>" + r.formUpclssNm + "</td></tr>";
    }).join("");
}

function showStatus(msg) {
    const s = document.getElementById("status");
    s.style.display = "block";
    s.innerHTML = msg;
}

</script>
