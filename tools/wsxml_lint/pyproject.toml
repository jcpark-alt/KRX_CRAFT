[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wsxml-lint"
version = "0.1.0"
description = "WebSquare XML 오류 검사/파싱 도구 (lxml 기반)"
requires-python = ">=3.9"
dependencies = ["lxml>=5.0"]

[project.scripts]
wsxml-lint = "wsxml_lint.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["wsxml_lint*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
